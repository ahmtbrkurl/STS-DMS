<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>STS-DMS — Başvuru Gönderme Test Sayfası (v5)</title>
<style>
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; background:#0f1115; color:#e6e6e6; padding:24px; max-width:700px; margin:0 auto; }
  h1 { font-size:20px; }
  label { display:block; margin-top:14px; font-size:13px; color:#9aa0a6; }
  input, textarea { width:100%; padding:8px; margin-top:4px; background:#1b1e24; border:1px solid #333; color:#fff; border-radius:6px; box-sizing:border-box; font-family: monospace; }
  button { margin-top:16px; padding:10px 18px; background:#2563eb; border:none; color:#fff; border-radius:6px; cursor:pointer; font-weight:600; }
  button:hover { background:#1d4ed8; }
  pre { background:#1b1e24; padding:14px; border-radius:8px; margin-top:16px; white-space:pre-wrap; word-break:break-all; border:1px solid #333; }
  fieldset { margin-top:20px; border:1px solid #333; border-radius:8px; padding:12px; }
  legend { padding:0 6px; color:#9aa0a6; font-size:13px; }
  .field-row { margin-bottom:14px; }
  canvas.sigcanvas { border:1px solid #444; border-radius:6px; background:transparent; touch-action:none; cursor:crosshair; }
  .sig-buttons { margin-top:6px; }
  .sig-buttons button { padding:6px 12px; font-size:12px; margin-right:6px; }
  .template-link { display:inline-block; margin-top:4px; margin-bottom:8px; font-size:12px; color:#60a5fa; }

  .btn { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:6px; font-size:13px; font-weight:600; border:1px solid transparent; cursor:pointer; margin-top:0; }
  .btn-primary { background:#2563eb; color:#fff; }
  .btn-primary:disabled { background:#334155; cursor:not-allowed; opacity:0.7; }
  .btn-secondary { background:#1b1e24; color:#e6e6e6; border-color:#333; }

  .idcap-sides { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px; }
  @media (max-width:480px) { .idcap-sides { grid-template-columns:1fr; } }
  .idcap-single { max-width:260px; margin-top:6px; }
  .idcap-box { border:1px solid #333; border-radius:8px; padding:10px; }
  .idcap-label { font-weight:600; font-size:11px; color:#9aa0a6; margin-bottom:6px; text-transform:uppercase; letter-spacing:0.03em; }
  .idcap-empty { background:#1b1e24; border:1px dashed #333; border-radius:6px; padding:20px 8px; text-align:center; color:#6b7280; font-size:11px; margin-bottom:8px; }
  .idcap-preview { width:100%; max-height:140px; object-fit:contain; border-radius:6px; margin-bottom:8px; background:#000; display:block; }
  .idcap-preview-portrait { max-height:200px; aspect-ratio:3/4; object-fit:cover; }
  .idcap-actions { display:flex; flex-direction:column; gap:6px; }
  .idcap-actions .btn { width:100%; justify-content:center; font-size:11px; padding:7px 8px; }
  .idcap-merge-status { font-size:11px; color:#6b7280; margin-top:6px; min-height:14px; }

  .idcap-modal { position:fixed; inset:0; background:rgba(0,0,0,0.88); z-index:1000; display:flex; align-items:center; justify-content:center; padding:16px; }
  .idcap-modal-inner { background:#14161b; border-radius:12px; padding:16px; max-width:440px; width:100%; }
  .idcap-modal-header { color:#fff; font-weight:600; margin-bottom:12px; text-align:center; font-size:13px; }
  .idcap-video-wrap { position:relative; border-radius:8px; overflow:hidden; background:#000; aspect-ratio:4/3; }
  .idcap-video-portrait { aspect-ratio:3/4; }
  .idcap-video { width:100%; height:100%; object-fit:cover; display:block; cursor:pointer; }
  .idcap-guide { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:82%; aspect-ratio:1.586/1; border:2px dashed rgba(255,255,255,0.65); border-radius:12px; box-shadow:0 0 0 999px rgba(0,0,0,0.45); pointer-events:none; }
  .idcap-guide-portrait { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:62%; height:82%; display:flex; align-items:center; justify-content:center; border-radius:8px; box-shadow:0 0 0 999px rgba(0,0,0,0.45); pointer-events:none; }
  .idcap-portrait-svg { width:100%; height:100%; }
  .idcap-modal-hint { color:#cbd5e1; font-size:11px; text-align:center; margin-top:12px; min-height:16px; }
  .idcap-modal-actions { display:flex; gap:10px; justify-content:center; margin-top:14px; }
  .idcap-modal-actions .btn { min-width:100px; justify-content:center; }
</style>
</head>
<body>
  <h1>STS-DMS — Başvuru Gönderme Test Sayfası</h1>
  <p style="color:#f59e0b; font-size:12px;">v5: otomatik odaklama iyileştirmeleri (sürekli AF isteği, ~1sn odaklanma bekletmesi, video'ya dokununca yeniden odaklama) + çözünürlük/kalite artırıldı.</p>

  <label>Web App URL</label>
  <input id="baseUrl" value="https://script.google.com/macros/s/AKfycbzztkmZ4T4BbxxrD2-0fxK7I8s77nyBcRA49kfjLg1G7JDe_MQszFnTj-0JjKPIaQJx3g/exec">

  <label>Link Token (links.create'ten aldığınız token)</label>
  <input id="linkToken" placeholder="örn. BIGZC29Nwlkt0U4HgYcZ3Sjuw8rue9rE">

  <button onclick="loadForm()">1) Formu Yükle</button>

  <div id="formArea"></div>

  <h3>Sonuç</h3>
  <pre id="result">—</pre>

<script>
// ============================================================
// STSIDCapture — kamera + kılavuz + odaklama iyileştirmeleri
// ============================================================
const STSIDCapture = (function () {
  let activeStream = null;

  function attach(container, options) {
    const isPortrait = options.guideType === 'portrait';
    render(options.existingPreview || null);

    function render(previewDataUrl) {
      container.innerHTML =
        '<div class="idcap-box">' +
          '<div class="idcap-label">' + escapeHtml(options.label) + '</div>' +
          (previewDataUrl
            ? '<img src="' + previewDataUrl + '" class="idcap-preview' + (isPortrait ? ' idcap-preview-portrait' : '') + '" alt="">'
            : '<div class="idcap-empty">' + escapeHtml(options.hint || '') + '</div>') +
          '<div class="idcap-actions">' +
            '<button type="button" class="btn btn-secondary idcap-camera-btn">📷 Kamera ile Çek</button>' +
            '<label class="btn btn-secondary idcap-upload-btn" style="cursor:pointer;">📁 Dosyadan Seç' +
              '<input type="file" accept="image/*" style="display:none" class="idcap-file-input"></label>' +
          '</div>' +
        '</div>';

      container.querySelector('.idcap-camera-btn').addEventListener('click', openCameraModal);
      container.querySelector('.idcap-file-input').addEventListener('change', handleFileInput);
    }

    function handleFileInput(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function () {
        const dataUrl = reader.result;
        const base64 = dataUrl.split(',')[1];
        const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
        render(dataUrl);
        options.onCapture({ base64: base64, mimeType: file.type || 'image/jpeg', extension: ext });
      };
      reader.readAsDataURL(file);
    }

    function openCameraModal() {
      const modal = document.createElement('div');
      modal.className = 'idcap-modal';
      modal.innerHTML =
        '<div class="idcap-modal-inner">' +
          '<div class="idcap-modal-header">' + escapeHtml(options.label) + '</div>' +
          '<div class="idcap-video-wrap' + (isPortrait ? ' idcap-video-portrait' : '') + '">' +
            '<video autoplay playsinline muted class="idcap-video"></video>' +
            (isPortrait ? renderPortraitGuideSvg() : '<div class="idcap-guide"></div>') +
          '</div>' +
          '<div class="idcap-modal-hint">Kamera açılıyor...</div>' +
          '<div class="idcap-modal-actions">' +
            '<button type="button" class="btn btn-secondary idcap-cancel">İptal</button>' +
            '<button type="button" class="btn btn-primary idcap-shoot" disabled>Odaklanıyor...</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(modal);

      const video = modal.querySelector('.idcap-video');
      const hintEl = modal.querySelector('.idcap-modal-hint');
      const shootBtn = modal.querySelector('.idcap-shoot');
      const facingMode = options.facingMode || (isPortrait ? 'user' : 'environment');
      let currentTrack = null;

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        hintEl.textContent = 'Bu tarayıcı kamera erişimini desteklemiyor. Lütfen dosyadan yükleyin.';
        shootBtn.textContent = 'Çek';
      } else {
        navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: facingMode,
            width: { ideal: 2560 },
            height: { ideal: 1920 },
            advanced: [{ focusMode: 'continuous' }]
          },
          audio: false
        })
          .then(function (stream) {
            activeStream = stream;
            video.srcObject = stream;
            currentTrack = stream.getVideoTracks()[0];
            tryEnableContinuousFocus(currentTrack);

            hintEl.textContent = 'Odaklanılıyor, sabit tutun...';
            setTimeout(function () {
              shootBtn.disabled = false;
              shootBtn.textContent = 'Çek';
              hintEl.textContent = options.hint || 'Belgeyi çerçeveye hizalayın';
            }, 1100);
          })
          .catch(function (err) {
            hintEl.textContent = 'Kameraya erişilemedi (' + err.message + '). Lütfen dosyadan yükleyin.';
            shootBtn.disabled = true;
          });

        video.addEventListener('click', function () {
          if (currentTrack) refocus(currentTrack, hintEl, options.hint);
        });
      }

      modal.querySelector('.idcap-cancel').addEventListener('click', closeModal);
      shootBtn.addEventListener('click', function () {
        if (!video.videoWidth || shootBtn.disabled) return;
        const dataUrl = isPortrait ? capturePortraitFrame(video) : captureCardFrame(video);
        const base64 = dataUrl.split(',')[1];
        render(dataUrl);
        options.onCapture({ base64: base64, mimeType: 'image/jpeg', extension: 'jpg' });
        closeModal();
      });

      function closeModal() {
        if (activeStream) {
          activeStream.getTracks().forEach(function (t) { t.stop(); });
          activeStream = null;
        }
        if (modal.parentNode) document.body.removeChild(modal);
      }
    }
  }

  function tryEnableContinuousFocus(track) {
    if (!track || !track.getCapabilities) return;
    try {
      const caps = track.getCapabilities();
      if (caps.focusMode && caps.focusMode.indexOf('continuous') !== -1) {
        track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function () {});
      }
    } catch (e) { /* desteklenmiyor, sorun değil */ }
  }

  function refocus(track, hintEl, originalHint) {
    if (!track || !track.getCapabilities) return;
    try {
      const caps = track.getCapabilities();
      if (caps.focusMode && caps.focusMode.indexOf('single-shot') !== -1) {
        hintEl.textContent = 'Yeniden odaklanılıyor...';
        track.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] })
          .then(function () {
            setTimeout(function () {
              hintEl.textContent = originalHint || 'Belgeyi çerçeveye hizalayın';
              track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function () {});
            }, 600);
          })
          .catch(function () {});
      }
    } catch (e) { /* desteklenmiyor */ }
  }

  function attachTwoSided(container, options) {
    let frontData = null;
    let backData = null;

    container.innerHTML =
      '<div class="idcap-sides"><div class="idcap-front-slot"></div><div class="idcap-back-slot"></div></div>' +
      '<div class="idcap-merge-status"></div>';

    const frontSlot = container.querySelector('.idcap-front-slot');
    const backSlot = container.querySelector('.idcap-back-slot');
    const statusEl = container.querySelector('.idcap-merge-status');

    attach(frontSlot, {
      label: options.frontLabel || 'Ön Yüz', hint: options.hint, guideType: 'card',
      onCapture: function (data) { frontData = data; tryMerge(); }
    });
    attach(backSlot, {
      label: options.backLabel || 'Arka Yüz', hint: options.hint, guideType: 'card',
      onCapture: function (data) { backData = data; tryMerge(); }
    });

    function tryMerge() {
      if (!frontData || !backData) { statusEl.textContent = ''; return; }
      statusEl.textContent = 'Birleştiriliyor...';
      mergeStacked(
        'data:' + frontData.mimeType + ';base64,' + frontData.base64,
        'data:' + backData.mimeType + ';base64,' + backData.base64,
        function (mergedDataUrl) {
          const base64 = mergedDataUrl.split(',')[1];
          statusEl.textContent = '✓ Ön ve arka yüz tek görselde birleştirildi';
          options.onMerged({ base64: base64, mimeType: 'image/jpeg', extension: 'jpg' });
        }
      );
    }
  }

  function mergeStacked(dataUrlTop, dataUrlBottom, callback) {
    const imgTop = new Image();
    const imgBottom = new Image();
    let loaded = 0;
    function onBothLoaded() {
      const width = Math.max(imgTop.width, imgBottom.width);
      const scaleTop = width / imgTop.width;
      const scaleBottom = width / imgBottom.width;
      const heightTop = imgTop.height * scaleTop;
      const heightBottom = imgBottom.height * scaleBottom;
      const gap = Math.round(width * 0.02);
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = heightTop + gap + heightBottom;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(imgTop, 0, 0, width, heightTop);
      ctx.drawImage(imgBottom, 0, heightTop + gap, width, heightBottom);
      callback(canvas.toDataURL('image/jpeg', 0.95));
    }
    imgTop.onload = function () { loaded++; if (loaded === 2) onBothLoaded(); };
    imgBottom.onload = function () { loaded++; if (loaded === 2) onBothLoaded(); };
    imgTop.src = dataUrlTop;
    imgBottom.src = dataUrlBottom;
  }

  function renderPortraitGuideSvg() {
    return '<div class="idcap-guide-portrait">' +
      '<svg viewBox="0 0 200 280" class="idcap-portrait-svg" preserveAspectRatio="xMidYMid meet">' +
        '<ellipse cx="100" cy="95" rx="58" ry="75" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="3" stroke-dasharray="7 5"/>' +
        '<path d="M12,280 C12,188 55,163 100,163 C145,163 188,188 188,280" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="3" stroke-dasharray="7 5"/>' +
      '</svg>' +
    '</div>';
  }

  function captureCardFrame(video) {
    const containerAspect = 4 / 3;
    const vw = video.videoWidth, vh = video.videoHeight;
    let cw, ch, cx, cy;
    if (vw / vh > containerAspect) { ch = vh; cw = vh * containerAspect; cx = (vw - cw) / 2; cy = 0; }
    else { cw = vw; ch = vw / containerAspect; cx = 0; cy = (vh - ch) / 2; }

    const guideW = cw * 0.82;
    const guideH = guideW / 1.586;
    const guideX = cx + (cw - guideW) / 2;
    const guideY = cy + (ch - guideH) / 2;

    const canvas = document.createElement('canvas');
    canvas.width = guideW;
    canvas.height = guideH;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, guideX, guideY, guideW, guideH, 0, 0, guideW, guideH);
    return canvas.toDataURL('image/jpeg', 0.95);
  }

  function capturePortraitFrame(video) {
    const containerAspect = 3 / 4;
    const vw = video.videoWidth, vh = video.videoHeight;
    let cw, ch, cx, cy;
    if (vw / vh > containerAspect) { ch = vh; cw = vh * containerAspect; cx = (vw - cw) / 2; cy = 0; }
    else { cw = vw; ch = vw / containerAspect; cx = 0; cy = (vh - ch) / 2; }

    const guideW = cw * 0.62;
    const guideH = ch * 0.82;
    const guideX = cx + (cw - guideW) / 2;
    const guideY = cy + (ch - guideH) / 2;

    const canvas = document.createElement('canvas');
    canvas.width = guideW;
    canvas.height = guideH;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, guideX, guideY, guideW, guideH, 0, 0, guideW, guideH);
    return canvas.toDataURL('image/jpeg', 0.95);
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }

  return { attach: attach, attachTwoSided: attachTwoSided };
})();

// ============================================================
// Test sayfası mantığı
// ============================================================
let currentForm = null;
let fileData = {};

async function callApi(base, payload) {
  const res = await fetch(base, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  const text = await res.text();
  try { return JSON.parse(text); } catch (e) { return { raw: text }; }
}

async function loadForm() {
  const base = document.getElementById('baseUrl').value.trim();
  const linkToken = document.getElementById('linkToken').value.trim();
  document.getElementById('result').textContent = 'Yükleniyor...';

  const json = await callApi(base, { action: 'links.validate', linkToken: linkToken });
  document.getElementById('result').textContent = JSON.stringify(json, null, 2);

  if (!json.ok) return;
  currentForm = json.form;
  fileData = {};
  renderForm(json.form);
}

function renderForm(form) {
  const area = document.getElementById('formArea');
  let html = '<fieldset><legend>' + form.Name + '</legend>';

  form.fields.forEach(f => {
    const isTwoSided = (f.Type === 'Belge') && (f.TwoSided === true || f.TwoSided === 'TRUE');
    const isVesikalik = (f.Type === 'Fotoğraf') && (f.VesikalikMode === true || f.VesikalikMode === 'TRUE');

    html += '<div class="field-row" id="fieldwrap_' + f.FieldID + '">';
    html += '<label>' + f.Label + (f.Required === true || f.Required === 'TRUE' ? ' *' : '') +
      ' (' + f.Type + (isTwoSided ? ' — İki Taraflı (tek görselde birleşir)' : '') + (isVesikalik ? ' — Vesikalık' : '') + ')</label>';

    if (f.TemplateFileUrl) {
      html += '<a class="template-link" href="' + f.TemplateFileUrl + '" target="_blank">📄 Şablonu İndir (' + (f.TemplateFileName || 'dosya') + ')</a>';
    }

    if (isTwoSided) {
      html += '<div id="idcap_' + f.FieldID + '" class="idcap-sides"></div>';
    } else if (isVesikalik) {
      html += '<div id="idcap_' + f.FieldID + '" class="idcap-single"></div>';
    } else if (f.Type === 'Belge' || f.Type === 'Fotoğraf') {
      html += '<input type="file" accept="image/*,application/pdf" onchange="handleSimpleFileInput(event, \'' + f.FieldID + '\')">';
    } else if (f.Type === 'İmza') {
      html += '<canvas class="sigcanvas" id="sig_' + f.FieldID + '" width="400" height="150"></canvas>';
      html += '<div class="sig-buttons"><button type="button" onclick="clearSignature(\'' + f.FieldID + '\')">Temizle</button>';
      html += '<button type="button" onclick="saveSignature(\'' + f.FieldID + '\')">Onayla</button></div>';
      html += '<span id="sigstatus_' + f.FieldID + '"></span>';
    } else if (f.Type === 'Onay') {
      html += '<input type="checkbox" id="field_' + f.FieldID + '" style="width:auto">';
    } else {
      html += '<input type="text" id="field_' + f.FieldID + '" placeholder="' + f.Label + '">';
    }
    html += '</div>';
  });

  html += '<div class="field-row"><label><input type="checkbox" id="kvkkConsent" style="width:auto"> KVKK Aydınlatma Metnini okudum, kabul ediyorum (test)</label></div>';
  html += '</fieldset>';
  html += '<button onclick="submitApplication()">2) Başvuruyu Gönder</button>';

  area.innerHTML = html;

  form.fields.filter(f => f.Type === 'İmza').forEach(f => setupSignatureCanvas(f.FieldID));

  form.fields.filter(f => f.Type === 'Belge' && (f.TwoSided === true || f.TwoSided === 'TRUE')).forEach(f => {
    const wrap = document.getElementById('idcap_' + f.FieldID);
    STSIDCapture.attachTwoSided(wrap, {
      hint: (f.Label || 'Belge') + ' yüzünü çerçeveye hizalayıp çekin',
      onMerged: function (data) { fileData[f.FieldID] = data; }
    });
  });

  form.fields.filter(f => f.Type === 'Fotoğraf' && (f.VesikalikMode === true || f.VesikalikMode === 'TRUE')).forEach(f => {
    const wrap = document.getElementById('idcap_' + f.FieldID);
    STSIDCapture.attach(wrap, {
      label: f.Label || 'Vesikalık Fotoğraf',
      hint: 'Kafanızı ve omuzlarınızı kılavuza hizalayın',
      guideType: 'portrait',
      facingMode: 'user',
      onCapture: function (data) { fileData[f.FieldID] = data; }
    });
  });
}

function handleSimpleFileInput(event, fieldId) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function () {
    const base64 = reader.result.split(',')[1];
    const ext = file.name.split('.').pop();
    fileData[fieldId] = { base64: base64, mimeType: file.type, extension: ext };
  };
  reader.readAsDataURL(file);
}

const sigContexts = {};

function setupSignatureCanvas(fieldId) {
  const canvas = document.getElementById('sig_' + fieldId);
  const ctx = canvas.getContext('2d');
  ctx.strokeStyle = '#2563eb';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  sigContexts[fieldId] = { canvas: canvas, ctx: ctx, drawing: false };

  const getPos = (e) => {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  };

  const start = (e) => { sigContexts[fieldId].drawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); };
  const move = (e) => { if (!sigContexts[fieldId].drawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); };
  const end = () => { sigContexts[fieldId].drawing = false; };

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start);
  canvas.addEventListener('touchmove', move);
  canvas.addEventListener('touchend', end);
}

function clearSignature(fieldId) {
  const c = sigContexts[fieldId];
  c.ctx.clearRect(0, 0, c.canvas.width, c.canvas.height);
  delete fileData[fieldId];
  document.getElementById('sigstatus_' + fieldId).textContent = '';
}

function saveSignature(fieldId) {
  const c = sigContexts[fieldId];
  const dataUrl = c.canvas.toDataURL('image/png');
  const base64 = dataUrl.split(',')[1];
  fileData[fieldId] = { base64: base64, mimeType: 'image/png', extension: 'png' };
  document.getElementById('sigstatus_' + fieldId).textContent = ' ✓ İmza kaydedildi';
}

async function submitApplication() {
  const base = document.getElementById('baseUrl').value.trim();
  const linkToken = document.getElementById('linkToken').value.trim();

  const formData = {};
  currentForm.fields.forEach(f => {
    if (f.Type === 'Belge' || f.Type === 'Fotoğraf' || f.Type === 'İmza') return;
    const el = document.getElementById('field_' + f.FieldID);
    if (!el) return;
    formData[f.FieldID] = el.type === 'checkbox' ? el.checked : el.value;
  });

  const kvkkConsent = document.getElementById('kvkkConsent').checked;

  document.getElementById('result').textContent = 'Gönderiliyor...';

  const payload = {
    action: 'application.submit',
    linkToken: linkToken,
    formData: formData,
    files: fileData,
    kvkkConsent: kvkkConsent
  };

  const json = await callApi(base, payload);
  document.getElementById('result').textContent = JSON.stringify(json, null, 2);
}
</script>

</body>
</html>
