<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STS-DMS — Dashboard</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>

<div id="app-shell"></div>

<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/loading.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
  (async function () {
    await STSI18N.init();
    STSLayout.render({ activeNav: 'dashboard', eyebrow: 'dashboard.eyebrow', title: 'dashboard.title' });
    STSI18N.onChange(renderContent);
    await renderContent();
  })();

  async function renderContent() {
    const content = document.getElementById('page-content');
    content.innerHTML = '<div class="empty-state" data-i18n="common.loading"></div>';
    STSI18N.applyToDom();

    const result = await STSAPI.call('dashboard.stats');

    if (!result.ok) {
      content.innerHTML = '<div class="empty-state">' + (result.error || STSI18N.t('common.error.generic')) + '</div>';
      return;
    }

    const s = result.data;

    content.innerHTML =
      '<div class="stat-grid">' +
        statCard(STSI18N.t('dashboard.totalPersonnel'), s.totalPersonnel) +
        statCard(STSI18N.t('dashboard.activeGroups'), s.activeGroups) +
        statCard(STSI18N.t('dashboard.activeLinks'), s.activeLinks) +
        statCard(STSI18N.t('dashboard.pendingApplications'), s.pendingApplications) +
        statCard(STSI18N.t('dashboard.pendingDocuments'), s.pendingDocuments) +
      '</div>' +
      '<div class="card">' +
        '<div class="card-header">' +
          '<div>' +
            '<p class="card-title">' + STSI18N.t('dashboard.quickActions') + '</p>' +
            '<p class="card-subtitle">' + STSI18N.t('dashboard.quickActionsDesc') + '</p>' +
          '</div>' +
        '</div>' +
        '<div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px;">' +
          quickAction('groups.html', STSI18N.t('dashboard.newGroup')) +
          quickAction('forms.html', STSI18N.t('dashboard.designForm')) +
          quickAction('links.html', STSI18N.t('dashboard.newLink')) +
          quickAction('personnel.html', STSI18N.t('dashboard.viewPersonnel')) +
        '</div>' +
      '</div>' +
      '<div id="user-activity-area"></div>';

    // Kullanıcı aktivite özeti — sadece Admin görebilir (backend de zaten kısıtlıyor)
    if (STSAPI.hasRole('Admin')) {
      const activityResult = await STSAPI.call('dashboard.userActivity');
      if (activityResult.ok) {
        document.getElementById('user-activity-area').innerHTML = renderUserActivityCard(activityResult.data);
        STSI18N.applyToDom();
      }
    }
  }

  function renderUserActivityCard(users) {
    if (!users || users.length === 0) {
      return '<div class="card">' +
        '<p class="card-title">' + STSI18N.t('dashboard.userActivityTitle') + '</p>' +
        '<div class="empty-state">' + STSI18N.t('dashboard.noActivity') + '</div>' +
      '</div>';
    }

    const CREATE_ACTIONS = ['GroupCreate', 'FormCreate', 'CampaignCreate', 'LinkCreate'];
    const UPDATE_ACTIONS = ['ApplicationStatusUpdate', 'DocumentStatusUpdate'];
    const DELETE_ACTIONS = ['FormDelete', 'CampaignDelete', 'LinkDelete', 'PersonnelDelete'];

    function sumActions(byAction, list) {
      return list.reduce((sum, a) => sum + (byAction[a] || 0), 0);
    }

    const rows = users.map(u => {
      return '<tr>' +
        '<td><strong>' + escapeHtmlDash(u.username) + '</strong></td>' +
        '<td>' + u.total + '</td>' +
        '<td>' + sumActions(u.byAction, CREATE_ACTIONS) + '</td>' +
        '<td>' + sumActions(u.byAction, UPDATE_ACTIONS) + '</td>' +
        '<td>' + (u.byAction['PersonnelCreate'] || 0) + '</td>' +
        '<td>' + sumActions(u.byAction, DELETE_ACTIONS) + '</td>' +
      '</tr>';
    }).join('');

    return '<div class="card">' +
      '<div class="card-header">' +
        '<div>' +
          '<p class="card-title">' + STSI18N.t('dashboard.userActivityTitle') + '</p>' +
          '<p class="card-subtitle">' + STSI18N.t('dashboard.userActivityDesc') + '</p>' +
        '</div>' +
      '</div>' +
      '<table class="data-table"><thead><tr>' +
        '<th>' + STSI18N.t('dashboard.colUser') + '</th>' +
        '<th>' + STSI18N.t('dashboard.colTotal') + '</th>' +
        '<th>' + STSI18N.t('dashboard.colCreated') + '</th>' +
        '<th>' + STSI18N.t('dashboard.colUpdated') + '</th>' +
        '<th>' + STSI18N.t('dashboard.colPersonnelCreated') + '</th>' +
        '<th>' + STSI18N.t('dashboard.colDeleted') + '</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>' +
    '</div>';
  }

  function escapeHtmlDash(str) {
    return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function statCard(label, value) {
    return '<div class="stat-card"><div class="stat-label">' + label + '</div><div class="stat-value">' + value + '</div></div>';
  }

  function quickAction(href, label) {
    return '<a href="' + href + '" class="btn btn-secondary" style="justify-content:center;">' + label + '</a>';
  }
</script>

</body>
</html>
