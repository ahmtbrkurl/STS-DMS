<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STS-DMS — Başvuru Linkleri</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>

<div id="app-shell"></div>

<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
  const APPLY_BASE_URL = 'https://ahmtbrkurl.github.io/STS-DMS/apply/';

  let campaigns = [];
  let groups = [];
  let forms = [];
  let links = [];

  (async function () {
    await STSI18N.init();
    STSLayout.render({ activeNav: 'links', eyebrow: 'dashboard.eyebrow', title: 'links.title' });
    STSI18N.onChange(fullRerender);
    await loadAll();
    fullRerender();
  })();

  async function loadAll() {
    const [c, g, f, l] = await Promise.all([
      STSAPI.call('campaigns.list'),
      STSAPI.call('groups.list'),
      STSAPI.call('forms.list'),
      STSAPI.call('links.list')
    ]);
    campaigns = c.ok ? c.data : [];
    groups = g.ok ? g.data : [];
    forms = f.ok ? f.data : [];
    links = l.ok ? l.data : [];
  }

  function fullRerender() {
    const content = document.getElementById('page-content');
    content.innerHTML =
      '<div class="card">' +
        '<div class="card-header">' +
          '<div>' +
            '<p class="card-title" data-i18n="links.title"></p>' +
            '<p class="card-subtitle" data-i18n="links.subtitle"></p>' +
          '</div>' +
        '</div>' +
        '<div class="field"><label data-i18n="links.campaign"></label><select id="l-campaign"></select></div>' +
        '<div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;">' +
          '<div class="field" style="margin:0;"><label data-i18n="links.maxUsage"></label><input type="number" id="l-maxusage" value="30" min="0"></div>' +
          '<div class="field" style="margin:0;"><label data-i18n="links.startDate"></label><input type="datetime-local" id="l-start"></div>' +
          '<div class="field" style="margin:0;"><label data-i18n="links.endDate"></label><input type="datetime-local" id="l-end"></div>' +
        '</div>' +
        '<div style="display:flex; justify-content:flex-end;">' +
          '<button class="btn btn-primary" data-i18n="links.createLink" onclick="createLink()"></button>' +
        '</div>' +
        '<div id="new-link-result"></div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-header">' +
          '<div>' +
            '<p class="card-title" data-i18n="links.existing"></p>' +
            '<p class="card-subtitle" data-i18n="links.existingDesc"></p>' +
          '</div>' +
          '<button class="btn btn-secondary" data-i18n="forms.refresh" onclick="refreshList()"></button>' +
        '</div>' +
        '<div id="links-list-area"></div>' +
      '</div>';

    STSI18N.applyToDom();
    renderCampaignSelect();
    renderLinksList();
  }

  function renderCampaignSelect() {
    const sel = document.getElementById('l-campaign');
    sel.innerHTML = campaigns.filter(c => c.Status === 'Aktif')
      .map(c => '<option value="' + c.CampaignID + '">' + c.Name + '</option>').join('');
  }

  async function createLink() {
    const campaignId = document.getElementById('l-campaign').value;
    const maxUsage = parseInt(document.getElementById('l-maxusage').value, 10) || 0;
    const startDate = document.getElementById('l-start').value;
    const endDate = document.getElementById('l-end').value;

    if (!campaignId) { alert(STSI18N.t('links.selectCampaignFirst')); return; }

    const result = await STSAPI.call('links.create', {
      campaignId: campaignId, maxUsage: maxUsage, startDate: startDate, endDate: endDate
    });

    const resultBox = document.getElementById('new-link-result');
    if (result.ok) {
      const applyUrl = APPLY_BASE_URL + '?token=' + result.token;
      resultBox.innerHTML =
        '<div class="card" style="background:var(--brand-primary-light); border-color:var(--brand-primary); margin-top:16px; margin-bottom:0;">' +
          '<p style="margin:0 0 8px; font-weight:600; font-size:13px;">' + STSI18N.t('links.created') + ': ' + result.linkCode + '</p>' +
          '<div style="display:flex; gap:8px; align-items:center;">' +
            '<input type="text" readonly value="' + applyUrl + '" style="flex:1; padding:8px; border-radius:6px; border:1px solid var(--surface-border); font-size:12px; font-family:monospace;" id="new-link-url">' +
            '<button class="btn btn-primary" onclick="copyToClipboard(\'new-link-url\')" data-i18n="common.copy"></button>' +
          '</div>' +
        '</div>';
      STSI18N.applyToDom();
      await loadAll();
      renderLinksList();
    } else {
      resultBox.innerHTML = '<p style="color:var(--status-danger-text); font-size:13px; margin-top:10px;">' + (result.error || STSI18N.t('common.error.generic')) + '</p>';
    }
  }

  function copyToClipboard(elId) {
    const el = document.getElementById(elId);
    el.select();
    navigator.clipboard.writeText(el.value).then(() => {
      alert(STSI18N.t('common.copied'));
    }).catch(() => {
      document.execCommand('copy');
    });
  }

  async function toggleLinkStatus(linkCode, newStatus) {
    const result = await STSAPI.call('links.toggle', { linkCode: linkCode, status: newStatus });
    if (result.ok) { await loadAll(); renderLinksList(); }
    else alert(result.error || STSI18N.t('common.error.generic'));
  }

  async function refreshList() {
    await loadAll();
    fullRerender();
  }

  function renderLinksList() {
    const el = document.getElementById('links-list-area');
    if (links.length === 0) {
      el.innerHTML = '<div class="empty-state" data-i18n="links.noLinks"></div>';
      STSI18N.applyToDom();
      return;
    }

    const sorted = links.slice().sort((a, b) => new Date(b.CreatedAt) - new Date(a.CreatedAt));

    const rows = sorted.map(l => {
      const campaign = campaigns.find(c => c.CampaignID === l.CampaignID);
      const campaignName = campaign ? campaign.Name : l.CampaignID;
      const applyUrl = APPLY_BASE_URL + '?token=' + l.Token;
      const badgeClass = l.Status === 'Aktif' ? 'badge-success' : 'badge-neutral';
      const usageText = (l.UsedCount || 0) + ' / ' + (l.MaxUsage || '∞');

      return '<tr>' +
        '<td><code style="font-size:12px;">' + escapeHtml(l.LinkCode) + '</code></td>' +
        '<td>' + escapeHtml(campaignName) + '</td>' +
        '<td>' + usageText + '</td>' +
        '<td style="font-size:12px;">' + fmtDate(l.StartDate) + ' → ' + fmtDate(l.EndDate) + '</td>' +
        '<td><span class="badge ' + badgeClass + '">' + l.Status + '</span></td>' +
        '<td style="white-space:nowrap;">' +
          '<button class="btn btn-secondary" style="padding:5px 10px; font-size:12px;" onclick="copyLinkUrl(\'' + applyUrl + '\')" data-i18n="common.copy"></button> ' +
          '<button class="btn btn-secondary" style="padding:5px 10px; font-size:12px;" onclick="toggleLinkStatus(\'' + l.LinkCode + '\', \'' + (l.Status === 'Aktif' ? 'Pasif' : 'Aktif') + '\')">' +
            (l.Status === 'Aktif' ? STSI18N.t('common.inactive') : STSI18N.t('common.active')) +
          '</button>' +
        '</td>' +
      '</tr>';
    }).join('');

    el.innerHTML = '<table class="data-table"><thead><tr>' +
      '<th data-i18n="links.linkCode"></th><th data-i18n="links.campaign"></th><th data-i18n="links.usage"></th>' +
      '<th data-i18n="campaigns.dateRange"></th><th data-i18n="common.status"></th><th data-i18n="common.actions"></th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>';
    STSI18N.applyToDom();
  }

  function copyLinkUrl(url) {
    navigator.clipboard.writeText(url).then(() => {
      alert(STSI18N.t('common.copied'));
    }).catch(() => {
      prompt('Kopyalamak için:', url);
    });
  }

  function fmtDate(d) {
    if (!d) return '—';
    const date = new Date(d);
    if (isNaN(date.getTime())) return '—';
    return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
</script>

</body>
</html>
