<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STS-DMS — Kampanyalar</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>

<div id="app-shell"></div>

<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
  let groups = [];
  let forms = [];
  let campaigns = [];
  let editingCampaignId = null;
  let showInactive = false;

  (async function () {
    await STSI18N.init();
    STSLayout.render({ activeNav: 'campaigns', eyebrow: 'dashboard.eyebrow', title: 'campaigns.title' });
    STSI18N.onChange(fullRerender);
    await loadAll();
    fullRerender();
  })();

  async function loadAll() {
    const [g, f, c] = await Promise.all([
      STSAPI.call('groups.list'),
      STSAPI.call('forms.list'),
      STSAPI.call('campaigns.list')
    ]);
    groups = g.ok ? g.data : [];
    forms = f.ok ? f.data : [];
    campaigns = c.ok ? c.data : [];
  }

  function fullRerender() {
    const content = document.getElementById('page-content');
    content.innerHTML =
      '<div class="card">' +
        '<div class="card-header">' +
          '<div>' +
            '<p class="card-title" data-i18n="campaigns.title"></p>' +
            '<p class="card-subtitle" data-i18n="campaigns.subtitle"></p>' +
          '</div>' +
        '</div>' +
        '<div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">' +
          '<div class="field" style="margin:0;"><label data-i18n="campaigns.group"></label><select id="c-group" onchange="onGroupChange()"></select></div>' +
          '<div class="field" style="margin:0;"><label data-i18n="campaigns.form"></label><select id="c-form"></select></div>' +
        '</div>' +
        '<div class="field"><label data-i18n="campaigns.name"></label><input type="text" id="c-name" placeholder="örn. Ağustos 2026 Formen Alımı"></div>' +
        '<div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">' +
          '<div class="field" style="margin:0;"><label data-i18n="campaigns.startDate"></label><input type="date" id="c-start"></div>' +
          '<div class="field" style="margin:0;"><label data-i18n="campaigns.endDate"></label><input type="date" id="c-end"></div>' +
        '</div>' +
        '<div class="field"><label data-i18n="common.description"></label><input type="text" id="c-desc"></div>' +
        '<div style="display:flex; justify-content:flex-end; gap:10px; margin-top:6px;">' +
          '<button class="btn btn-secondary" data-i18n="common.cancel" onclick="resetForm()" style="' + (editingCampaignId ? '' : 'display:none;') + '" id="cancel-edit-btn"></button>' +
          '<button class="btn btn-primary" id="save-campaign-btn" onclick="saveCampaign()"></button>' +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-header">' +
          '<div>' +
            '<p class="card-title" data-i18n="campaigns.existing"></p>' +
            '<p class="card-subtitle" data-i18n="campaigns.existingDesc"></p>' +
          '</div>' +
          '<div style="display:flex; align-items:center; gap:12px;">' +
            '<label class="checkbox-row" style="margin:0;"><input type="checkbox" id="show-inactive-toggle" ' + (showInactive ? 'checked' : '') + ' onchange="toggleShowInactive()"> <span data-i18n="common.showInactive"></span></label>' +
            '<button class="btn btn-secondary" data-i18n="forms.refresh" onclick="refreshList()"></button>' +
          '</div>' +
        '</div>' +
        '<div id="campaigns-list-area"></div>' +
      '</div>';

    STSI18N.applyToDom();
    document.getElementById('save-campaign-btn').textContent = editingCampaignId ? STSI18N.t('common.save') : STSI18N.t('common.create');

    renderGroupSelect();
    onGroupChange();
    renderCampaignsList();
  }

  function renderGroupSelect() {
    const sel = document.getElementById('c-group');
    sel.innerHTML = groups.filter(g => g.Status === 'Aktif')
      .map(g => '<option value="' + g.GroupID + '">' + g.Name + '</option>').join('');
  }

  function onGroupChange() {
    const groupId = document.getElementById('c-group').value;
    const sel = document.getElementById('c-form');
    const relevantForms = forms.filter(f => f.GroupID === groupId && f.Status === 'Aktif');
    sel.innerHTML = relevantForms.map(f => '<option value="' + f.FormID + '">' + f.Name + '</option>').join('');
  }

  async function saveCampaign() {
    const groupId = document.getElementById('c-group').value;
    const formId = document.getElementById('c-form').value;
    const name = document.getElementById('c-name').value.trim();
    const startDate = document.getElementById('c-start').value;
    const endDate = document.getElementById('c-end').value;
    const description = document.getElementById('c-desc').value.trim();

    if (!name) { alert(STSI18N.t('campaigns.nameRequired')); return; }
    if (!groupId || !formId) { alert(STSI18N.t('campaigns.groupFormRequired')); return; }

    let result;
    if (editingCampaignId) {
      result = await STSAPI.call('campaigns.update', {
        campaignId: editingCampaignId, name: name, startDate: startDate, endDate: endDate, description: description
      });
    } else {
      result = await STSAPI.call('campaigns.create', {
        name: name, groupId: groupId, formId: formId, startDate: startDate, endDate: endDate, description: description
      });
    }

    if (result.ok) {
      editingCampaignId = null;
      await loadAll();
      fullRerender();
    } else {
      alert(result.error || STSI18N.t('common.error.generic'));
    }
  }

  function editCampaign(campaignId) {
    const c = campaigns.find(x => x.CampaignID === campaignId);
    if (!c) return;
    editingCampaignId = campaignId;
    fullRerender();
    document.getElementById('c-group').value = c.GroupID;
    onGroupChange();
    document.getElementById('c-form').value = c.FormID;
    document.getElementById('c-name').value = c.Name;
    document.getElementById('c-start').value = (c.StartDate || '').substring(0, 10);
    document.getElementById('c-end').value = (c.EndDate || '').substring(0, 10);
    document.getElementById('c-desc').value = c.Description || '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetForm() {
    editingCampaignId = null;
    fullRerender();
  }

  function toggleShowInactive() {
    showInactive = document.getElementById('show-inactive-toggle').checked;
    renderCampaignsList();
  }

  async function deleteCampaign(campaignId, name) {
    if (!confirm(STSI18N.t('common.deleteConfirm') + '\n\n' + name)) return;
    const result = await STSAPI.call('campaigns.delete', { campaignId: campaignId });
    if (result.ok) {
      await loadAll();
      renderCampaignsList();
    } else {
      alert(result.error || STSI18N.t('common.error.generic'));
    }
  }

  async function toggleCampaignStatus(campaignId, newStatus) {
    const result = await STSAPI.call('campaigns.update', { campaignId: campaignId, status: newStatus });
    if (result.ok) { await loadAll(); renderCampaignsList(); }
    else alert(result.error || STSI18N.t('common.error.generic'));
  }

  async function refreshList() {
    await loadAll();
    fullRerender();
  }

  function renderCampaignsList() {
    const el = document.getElementById('campaigns-list-area');
    const visibleCampaigns = showInactive ? campaigns : campaigns.filter(c => c.Status === 'Aktif');

    if (visibleCampaigns.length === 0) {
      el.innerHTML = '<div class="empty-state" data-i18n="campaigns.noCampaigns"></div>';
      STSI18N.applyToDom();
      return;
    }
    const rows = visibleCampaigns.map(c => {
      const groupName = (groups.find(g => g.GroupID === c.GroupID) || {}).Name || c.GroupID;
      const formName = (forms.find(f => f.FormID === c.FormID) || {}).Name || c.FormID;
      const badgeClass = c.Status === 'Aktif' ? 'badge-success' : 'badge-neutral';
      const deleteBtn = c.Status === 'Pasif'
        ? '<button class="btn btn-danger" style="padding:5px 10px; font-size:12px;" onclick="deleteCampaign(\'' + c.CampaignID + '\', \'' + escapeHtml(c.Name).replace(/'/g, "\\'") + '\')" data-i18n="common.delete"></button>'
        : '';
      return '<tr>' +
        '<td>' + escapeHtml(c.Name) + '</td>' +
        '<td>' + escapeHtml(groupName) + '</td>' +
        '<td>' + escapeHtml(formName) + '</td>' +
        '<td>' + (c.StartDate || '').substring(0, 10) + ' → ' + (c.EndDate || '').substring(0, 10) + '</td>' +
        '<td><span class="badge ' + badgeClass + '">' + c.Status + '</span></td>' +
        '<td style="font-size:12px; color:var(--text-secondary);">' + escapeHtml(c.CreatedBy || '') + '<br>' + fmtDateShort(c.CreatedAt) + '</td>' +
        '<td style="white-space:nowrap;">' +
          '<button class="btn btn-secondary" style="padding:5px 10px; font-size:12px;" onclick="editCampaign(\'' + c.CampaignID + '\')">' + STSI18N.t('common.edit') + '</button> ' +
          '<button class="btn btn-secondary" style="padding:5px 10px; font-size:12px;" onclick="toggleCampaignStatus(\'' + c.CampaignID + '\', \'' + (c.Status === 'Aktif' ? 'Pasif' : 'Aktif') + '\')">' +
            (c.Status === 'Aktif' ? STSI18N.t('common.inactive') : STSI18N.t('common.active')) +
          '</button> ' + deleteBtn +
        '</td>' +
      '</tr>';
    }).join('');

    el.innerHTML = '<table class="data-table"><thead><tr>' +
      '<th data-i18n="common.name"></th><th data-i18n="campaigns.group"></th><th data-i18n="campaigns.form"></th>' +
      '<th data-i18n="campaigns.dateRange"></th><th data-i18n="common.status"></th><th data-i18n="common.createdBy"></th><th data-i18n="common.actions"></th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>';
    STSI18N.applyToDom();
  }

  function fmtDateShort(d) {
    if (!d) return '—';
    const date = new Date(d);
    if (isNaN(date.getTime())) return '—';
    return date.toLocaleDateString();
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
</script>

</body>
</html>
