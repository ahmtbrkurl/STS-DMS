<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STS-DMS — Personeller</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>

<div id="app-shell"></div>

<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/loading.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
  let applications = [];
  let personnel = [];
  let links = [];
  let campaigns = [];
  let groups = [];
  let forms = [];
  let openApplicationId = null;
  let openApplicationDetail = null;
  let openApplicationFormDef = null;
  let statusFilter = '';
  let currentPage = 1;
  const PAGE_SIZE = 10;

  const DOC_STATUSES = ['Bekliyor', 'Eksik', 'İnceleniyor', 'Onaylandı', 'Reddedildi'];
  const APP_STATUSES = ['Bekliyor', 'İnceleniyor', 'Onaylandı', 'Reddedildi'];

  const REPORT_COLUMNS = [
    { key: 'candidate' },
    { key: 'group' },
    { key: 'campaign' },
    { key: 'linkCode' },
    { key: 'status' },
    { key: 'submittedAt' },
    { key: 'personnelId' },
    { key: 'phone' }
  ];

  (async function () {
    await STSI18N.init();
    STSLayout.render({ activeNav: 'personnel', eyebrow: 'dashboard.eyebrow', title: 'personnel.title' });
    STSI18N.onChange(fullRerender);
    await loadAll();
    fullRerender();
  })();

  async function loadAll() {
    const [a, p, l, c, g, f] = await Promise.all([
      STSAPI.call('applications.list'),
      STSAPI.call('personnel.list'),
      STSAPI.call('links.list'),
      STSAPI.call('campaigns.list'),
      STSAPI.call('groups.list'),
      STSAPI.call('forms.list')
    ]);
    applications = a.ok ? a.data : [];
    personnel = p.ok ? p.data : [];
    links = l.ok ? l.data : [];
    campaigns = c.ok ? c.data : [];
    groups = g.ok ? g.data : [];
    forms = f.ok ? f.data : [];
  }

  function resolveGroupForApplication(app) {
    const link = links.find(l => l.LinkCode === app.LinkCode);
    if (!link) return null;
    const campaign = campaigns.find(c => c.CampaignID === link.CampaignID);
    if (!campaign) return null;
    return { campaign: campaign, group: groups.find(g => g.GroupID === campaign.GroupID) };
  }

  function fullRerender() {
    const content = document.getElementById('page-content');
    content.innerHTML =
      '<div class="card">' +
        '<div class="card-header">' +
          '<div>' +
            '<p class="card-title" data-i18n="personnel.applicationsTitle"></p>' +
            '<p class="card-subtitle" data-i18n="personnel.applicationsDesc"></p>' +
          '</div>' +
          '<div style="display:flex; align-items:center; gap:10px;">' +
            '<select id="status-filter" onchange="onStatusFilterChange()" style="padding:8px 10px; border-radius:6px; border:1px solid var(--surface-border); font-size:13px;">' +
              '<option value="">' + STSI18N.t('personnel.allStatuses') + '</option>' +
              APP_STATUSES.map(s => '<option value="' + s + '"' + (s === statusFilter ? ' selected' : '') + '>' + s + '</option>').join('') +
            '</select>' +
            '<button class="btn btn-secondary" data-i18n="forms.refresh" onclick="refreshAll()"></button>' +
          '</div>' +
        '</div>' +
        '<div id="applications-list-area"></div>' +
        '<div id="pagination-area"></div>' +
      '</div>' +

      '<div class="card" id="report-builder-card">' +
        '<div class="card-header">' +
          '<div>' +
            '<p class="card-title" data-i18n="personnel.reportTitle"></p>' +
            '<p class="card-subtitle" data-i18n="personnel.reportDesc"></p>' +
          '</div>' +
        '</div>' +
        '<div style="display:grid; grid-template-columns:1fr 1fr; gap:24px;">' +
          '<div>' +
            '<p style="font-size:13px; font-weight:600; margin-bottom:8px;">' + STSI18N.t('personnel.reportStatusFilter') + '</p>' +
            APP_STATUSES.map(s => '<label class="checkbox-row" style="display:block; margin-bottom:6px;">' +
              '<input type="checkbox" class="report-status-cb" value="' + s + '" checked> <span>' + s + '</span></label>'
            ).join('') +
          '</div>' +
          '<div>' +
            '<p style="font-size:13px; font-weight:600; margin-bottom:8px;">' + STSI18N.t('personnel.reportColumns') + '</p>' +
            REPORT_COLUMNS.map(c => '<label class="checkbox-row" style="display:block; margin-bottom:6px;">' +
              '<input type="checkbox" id="report-col-' + c.key + '" checked> <span>' + STSI18N.t('personnel.reportCol.' + c.key) + '</span></label>'
            ).join('') +
          '</div>' +
        '</div>' +
        '<div style="margin-top:16px; font-size:11px; color:var(--text-muted);">' + STSI18N.t('personnel.reportCharsetNote') + '</div>' +
        '<div style="display:flex; justify-content:flex-end; gap:10px; margin-top:12px;">' +
          '<button class="btn" style="background:#1d6f42; color:#fff;" onclick="generateReportExcel()">📊 ' + STSI18N.t('personnel.reportGenerateExcel') + '</button>' +
          '<button class="btn btn-primary" onclick="generateReportPdf()">📄 ' + STSI18N.t('personnel.reportGenerate') + '</button>' +
        '</div>' +
      '</div>' +

      '<div id="detail-area"></div>' +
      '<div class="card">' +
        '<div class="card-header">' +
          '<div>' +
            '<p class="card-title" data-i18n="personnel.rosterTitle"></p>' +
            '<p class="card-subtitle" data-i18n="personnel.rosterDesc"></p>' +
          '</div>' +
        '</div>' +
        '<div id="personnel-list-area"></div>' +
      '</div>';

    STSI18N.applyToDom();
    renderApplicationsList();
    renderPersonnelList();
    if (openApplicationId) renderDetail();
  }

  async function refreshAll() {
    await loadAll();
    if (openApplicationId) await loadDetail(openApplicationId);
    fullRerender();
  }

  /**
   * WhatsApp mesaj linki üretir (wa.me) — gerçek bir WhatsApp API
   * entegrasyonu DEĞİLDİR, sadece hazır metinli bir link açar, HR
   * "Gönder"e kendisi basar. Telefon numarası bulunan HER başvuru
   * için görünür; mesaj içeriği başvuru/belge durumuna göre değişir:
   * - Reddedilen belge varsa (öncelikli): eksik/hatalı belgelerin listesi
   * - Onaylandı: tebrik mesajı
   * - İnceleniyor: inceleme devam ediyor mesajı
   * - Reddedildi (tüm başvuru): olumsuz sonuç mesajı
   * - Bekliyor: başvurunuz ulaştı mesajı
   * Her durumda sonunda düzenleme linki eklenir.
   */
  function buildWhatsAppButton(app, formData, fieldMap, rejectedDocs) {
    const phoneRaw = findPhoneValue(formData, fieldMap);
    if (!phoneRaw) return '';
    const digits = String(phoneRaw).replace(/\D/g, '');
    if (!digits) return '';

    const name = findCandidateName(formData, fieldMap) || (app.FolderName || '').replace(/_/g, ' ');
    const company = STSI18N.t('personnel.waCompanyName');
    const editUrl = 'https://ahmtbrkurl.github.io/STS-DMS/apply/edit.html?token=' + app.EditToken;

    let body;
    if (rejectedDocs.length > 0) {
      const list = rejectedDocs.map(d => {
        const f = fieldMap[d.FieldID];
        return '- ' + (f ? (f.FileLabel || f.Label) : d.FileName);
      }).join('\n');
      body = STSI18N.t('personnel.waRejectedDocsBody').replace('{company}', company).replace('{list}', list);
    } else if (app.Status === 'Onaylandı') {
      body = STSI18N.t('personnel.waApprovedBody').replace('{company}', company);
    } else if (app.Status === 'İnceleniyor') {
      body = STSI18N.t('personnel.waReviewingBody').replace('{company}', company);
    } else if (app.Status === 'Reddedildi') {
      body = STSI18N.t('personnel.waAppRejectedBody').replace('{company}', company);
    } else {
      body = STSI18N.t('personnel.waPendingBody').replace('{company}', company);
    }

    const footer = STSI18N.t('personnel.waEditLinkFooter').replace('{editUrl}', editUrl);
    const message = STSI18N.t('personnel.waGreeting').replace('{name}', name) + '\n\n' + body + '\n\n' + footer;

    const waUrl = 'https://wa.me/' + digits + '?text=' + encodeURIComponent(message);
    return '<a class="btn btn-primary" href="' + waUrl + '" target="_blank" rel="noopener">📱 ' + STSI18N.t('personnel.sendWhatsApp') + '</a>';
  }

  function findCandidateName(formData, fieldMap) {
    let ad = '', soyad = '';
    for (const fieldId in formData) {
      const f = fieldMap[fieldId];
      if (!f) continue;
      if (f.Label === 'Ad') ad = formData[fieldId];
      if (f.Label === 'Soyad') soyad = formData[fieldId];
    }
    const combined = (ad + ' ' + soyad).trim();
    return combined || null;
  }

  function findPhoneValue(formData, fieldMap) {
    for (const fieldId in formData) {
      const f = fieldMap[fieldId];
      if (f && f.Type === 'Telefon') return formData[fieldId];
    }
    return null;
  }

  function statusBadgeClass(status) {
    if (status === 'Onaylandı') return 'badge-success';
    if (status === 'Reddedildi') return 'badge-danger';
    if (status === 'İnceleniyor') return 'badge-info';
    if (status === 'Eksik') return 'badge-warning';
    return 'badge-neutral';
  }

  function onStatusFilterChange() {
    statusFilter = document.getElementById('status-filter').value;
    currentPage = 1;
    renderApplicationsList();
  }

  function goToPage(page) {
    currentPage = page;
    renderApplicationsList();
    document.getElementById('applications-list-area').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function renderApplicationsList() {
    const el = document.getElementById('applications-list-area');
    const pagerEl = document.getElementById('pagination-area');

    let filtered = statusFilter ? applications.filter(a => a.Status === statusFilter) : applications;
    filtered = filtered.slice().sort((a, b) => new Date(b.SubmittedAt) - new Date(a.SubmittedAt));

    if (filtered.length === 0) {
      el.innerHTML = '<div class="empty-state" data-i18n="personnel.noApplications"></div>';
      pagerEl.innerHTML = '';
      STSI18N.applyToDom();
      return;
    }

    const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
    const pageItems = filtered.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

    const rows = pageItems.map(app => {
      const resolved = resolveGroupForApplication(app);
      const groupName = resolved && resolved.group ? resolved.group.Name : '—';
      const displayName = (app.FolderName || '').replace(/_/g, ' ');
      const badgeClass = statusBadgeClass(app.Status);
      const personnelBadge = app.PersonnelID ? ' <span class="badge badge-info">' + escapeHtml(app.PersonnelID) + '</span>' : '';

      return '<tr>' +
        '<td>' + escapeHtml(displayName) + (Number(app.VersionNumber) > 1 ? ' <span class="badge badge-neutral">v' + app.VersionNumber + '</span>' : '') + '</td>' +
        '<td>' + escapeHtml(groupName) + '</td>' +
        '<td style="font-size:12px;">' + fmtDate(app.SubmittedAt) + '</td>' +
        '<td><span class="badge ' + badgeClass + '">' + app.Status + '</span>' + personnelBadge + '</td>' +
        '<td><button class="btn btn-secondary" style="padding:5px 10px; font-size:12px;" onclick="openDetail(\'' + app.ApplicationID + '\')" data-i18n="personnel.viewDetail"></button></td>' +
      '</tr>';
    }).join('');

    el.innerHTML = '<table class="data-table"><thead><tr>' +
      '<th data-i18n="personnel.candidate"></th><th data-i18n="campaigns.group"></th><th data-i18n="personnel.submittedAt"></th>' +
      '<th data-i18n="common.status"></th><th data-i18n="common.actions"></th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>';

    // Sayfalama kontrolleri
    if (totalPages > 1) {
      let pagerHtml = '<div class="pagination-bar">';
      pagerHtml += '<button class="btn btn-secondary" style="padding:5px 10px; font-size:12px;" ' + (currentPage === 1 ? 'disabled' : '') + ' onclick="goToPage(' + (currentPage - 1) + ')">‹</button>';
      pagerHtml += '<span class="pagination-info">' + currentPage + ' / ' + totalPages + '</span>';
      pagerHtml += '<button class="btn btn-secondary" style="padding:5px 10px; font-size:12px;" ' + (currentPage === totalPages ? 'disabled' : '') + ' onclick="goToPage(' + (currentPage + 1) + ')">›</button>';
      pagerHtml += '</div>';
      pagerEl.innerHTML = pagerHtml;
    } else {
      pagerEl.innerHTML = '';
    }

    STSI18N.applyToDom();
  }

  async function openDetail(applicationId) {
    openApplicationId = applicationId;
    await loadDetail(applicationId);
    renderDetail();
    document.getElementById('detail-area').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  async function loadDetail(applicationId) {
    const result = await STSAPI.call('applications.get', { applicationId: applicationId });
    if (!result.ok) { alert(result.error); return; }
    openApplicationDetail = result.data;

    const resolved = resolveGroupForApplication(openApplicationDetail);
    if (resolved && resolved.campaign) {
      const formResult = await STSAPI.call('forms.get', { formId: resolved.campaign.FormID });
      openApplicationFormDef = formResult.ok ? formResult.data : null;
    } else {
      openApplicationFormDef = null;
    }
  }

  let pendingAppStatus = null;
  let pendingDocStatuses = {}; // documentId -> yeni durum (sadece değiştirilenler)

  function closeDetail() {
    openApplicationId = null;
    openApplicationDetail = null;
    openApplicationFormDef = null;
    pendingAppStatus = null;
    pendingDocStatuses = {};
    document.getElementById('detail-area').innerHTML = '';
  }

  function setPendingAppStatus(value) { pendingAppStatus = value; updateSaveBarVisibility(); }
  function setPendingDocStatus(documentId, value) { pendingDocStatuses[documentId] = value; updateSaveBarVisibility(); }

  function hasPendingChanges() {
    return pendingAppStatus !== null || Object.keys(pendingDocStatuses).length > 0;
  }

  function updateSaveBarVisibility() {
    const bar = document.getElementById('save-bar');
    if (!bar) return;
    bar.style.display = hasPendingChanges() ? 'flex' : 'none';
  }

  async function saveDetailChanges() {
    if (pendingAppStatus !== null) {
      const r = await STSAPI.call('applications.updateStatus', { applicationId: openApplicationId, status: pendingAppStatus });
      if (!r.ok) { alert(r.error || STSI18N.t('common.error.generic')); return; }
    }
    for (const documentId in pendingDocStatuses) {
      const r = await STSAPI.call('documents.updateStatus', { documentId: documentId, status: pendingDocStatuses[documentId] });
      if (!r.ok) { alert(r.error || STSI18N.t('common.error.generic')); return; }
    }
    pendingAppStatus = null;
    pendingDocStatuses = {};
    await loadAll();
    await loadDetail(openApplicationId);
    fullRerender();
  }

  function cancelDetailChanges() {
    pendingAppStatus = null;
    pendingDocStatuses = {};
    renderDetail(); // ekranı son kaydedilmiş veriyle yeniden çiz (seçimleri geri al)
  }

  function renderDetail() {
    const el = document.getElementById('detail-area');
    if (!openApplicationDetail) { el.innerHTML = ''; return; }

    const app = openApplicationDetail;
    const formData = JSON.parse(app.FormDataJSON || '{}');
    const fieldMap = {};
    if (openApplicationFormDef) {
      openApplicationFormDef.fields.forEach(f => { fieldMap[f.FieldID] = f; });
    }

    const FILE_TYPES = ['Belge', 'Fotoğraf', 'İmza'];
    // Pozisyonel yedek eşleştirme: form daha sonra düzenlenip alan ID'leri
    // değişmiş olabilir (eski veriler için). Doğrudan ID eşleşmesi
    // bulunamazsa, aynı sıradaki metin alanına düşer.
    const nonFileFormFields = openApplicationFormDef
      ? openApplicationFormDef.fields.filter(f => FILE_TYPES.indexOf(f.Type) === -1)
      : [];

    let dataRowsHtml = '';
    Object.keys(formData).forEach((fieldId, idx) => {
      let field = fieldMap[fieldId];
      if (!field && nonFileFormFields[idx]) field = nonFileFormFields[idx];
      if (field && FILE_TYPES.indexOf(field.Type) !== -1) return;
      const label = field ? field.Label : fieldId;
      const value = formData[fieldId];
      if (value === '' || value === undefined) return;
      dataRowsHtml += '<div class="detail-data-row"><span class="detail-data-label">' + escapeHtml(label) + '</span><span class="detail-data-value">' + escapeHtml(String(value)) + '</span></div>';
    });

    const currentDocs = (app.documents || []).filter(d => d.IsCurrent === true);
    const combinedDoc = currentDocs.find(d => d.DocType === 'Combined');
    const individualDocs = currentDocs.filter(d => d.DocType === 'Individual');

    let docsHtml = '';
    if (combinedDoc) {
      docsHtml += '<div class="detail-doc-row">' +
        '<div class="detail-doc-info">📄 <strong>' + STSI18N.t('personnel.combinedPdf') + '</strong></div>' +
        '<a class="btn btn-secondary" style="padding:5px 10px; font-size:12px;" href="https://drive.google.com/file/d/' + combinedDoc.DriveFileID + '/view" target="_blank">' + STSI18N.t('personnel.viewFile') + '</a>' +
      '</div>';
    }

    individualDocs.forEach(d => {
      const field = fieldMap[d.FieldID];
      const label = field ? (field.FileLabel || field.Label) : d.FileName;
      docsHtml += '<div class="detail-doc-row">' +
        '<div class="detail-doc-info">' + escapeHtml(label) + '<br><span class="badge ' + statusBadgeClass(d.Status) + '" style="margin-top:4px;">' + d.Status + '</span></div>' +
        '<div style="display:flex; gap:6px; align-items:center;">' +
          '<a class="btn btn-secondary" style="padding:5px 10px; font-size:12px;" href="https://drive.google.com/file/d/' + d.DriveFileID + '/view" target="_blank">' + STSI18N.t('personnel.viewFile') + '</a>' +
          '<select class="doc-status-select" onchange="setPendingDocStatus(\'' + d.DocumentID + '\', this.value)">' +
            DOC_STATUSES.map(s => '<option value="' + s + '"' + (s === d.Status ? ' selected' : '') + '>' + s + '</option>').join('') +
          '</select>' +
        '</div>' +
      '</div>';
    });

    const canCreatePersonnel = app.Status === 'Onaylandı' && !app.PersonnelID;

    const rejectedIndividualDocs = individualDocs.filter(d => d.Status === 'Reddedildi');
    const whatsAppButtonHtml = buildWhatsAppButton(app, formData, fieldMap, rejectedIndividualDocs);

    el.innerHTML =
      '<div class="card" style="border-color:var(--brand-primary);">' +
        '<div class="card-header">' +
          '<div>' +
            '<p class="card-title">' + escapeHtml((app.FolderName || '').replace(/_/g, ' ')) + '</p>' +
            '<p class="card-subtitle">' + escapeHtml(app.ApplicationID) + ' — v' + app.VersionNumber + '</p>' +
          '</div>' +
          (whatsAppButtonHtml || '') +
        '</div>' +

        '<div style="display:flex; align-items:center; gap:10px; margin-bottom:20px;">' +
          '<label style="font-size:13px; font-weight:600; margin:0;" data-i18n="personnel.applicationStatus"></label>' +
          '<select class="doc-status-select" onchange="setPendingAppStatus(this.value)">' +
            APP_STATUSES.map(s => '<option value="' + s + '"' + (s === app.Status ? ' selected' : '') + '>' + s + '</option>').join('') +
          '</select>' +
          (canCreatePersonnel ? '<button class="btn btn-primary" onclick="createPersonnel()" data-i18n="personnel.createPersonnel"></button>' : '') +
          (app.PersonnelID ? '<span class="badge badge-info">' + STSI18N.t('personnel.linkedTo') + ': ' + escapeHtml(app.PersonnelID) + '</span>' : '') +
        '</div>' +

        '<p class="card-title" style="font-size:14px;" data-i18n="personnel.formData"></p>' +
        '<div class="detail-data-grid">' + (dataRowsHtml || '<p style="font-size:13px; color:var(--text-muted);">—</p>') + '</div>' +

        '<p class="card-title" style="font-size:14px; margin-top:20px;" data-i18n="personnel.documents"></p>' +
        '<div class="detail-doc-list">' + (docsHtml || '<p style="font-size:13px; color:var(--text-muted);">—</p>') + '</div>' +

        '<div id="save-bar" class="save-bar" style="display:none;">' +
          '<span class="save-bar-hint" data-i18n="personnel.unsavedChanges"></span>' +
          '<div style="display:flex; gap:8px;">' +
            '<button class="btn btn-secondary" onclick="cancelDetailChanges()" data-i18n="common.cancel"></button>' +
            '<button class="btn btn-primary" onclick="saveDetailChanges()" data-i18n="common.save"></button>' +
          '</div>' +
        '</div>' +
        '<div style="margin-top:16px;">' +
          '<button class="btn btn-secondary" onclick="closeDetail()" data-i18n="personnel.backToList"></button>' +
        '</div>' +
      '</div>';

    STSI18N.applyToDom();
  }

  async function createPersonnel() {
    const result = await STSAPI.call('personnel.createFromApplication', { applicationId: openApplicationId });
    if (!result.ok) { alert(result.error || STSI18N.t('common.error.generic')); return; }
    pendingAppStatus = null;
    pendingDocStatuses = {};
    await loadAll();
    await loadDetail(openApplicationId);
    fullRerender();
  }

  async function deletePersonnel(personnelId, name) {
    if (!confirm(STSI18N.t('common.deleteConfirm') + '\n\n' + name)) return;
    const result = await STSAPI.call('personnel.delete', { personnelId: personnelId });
    if (result.ok) {
      await loadAll();
      renderPersonnelList();
    } else {
      alert(result.error || STSI18N.t('common.error.generic'));
    }
  }

  function renderPersonnelList() {
    const el = document.getElementById('personnel-list-area');
    if (personnel.length === 0) {
      el.innerHTML = '<div class="empty-state" data-i18n="personnel.noPersonnel"></div>';
      STSI18N.applyToDom();
      return;
    }
    const rows = personnel.map(p => {
      const groupName = (groups.find(g => g.GroupID === p.GroupID) || {}).Name || p.GroupID;
      // Bu personelin bağlı olduğu güncel başvuruyu bul (belgeleri görüntülemek için)
      const linkedApp = applications.find(a => a.BaseApplicationID === p.BaseApplicationID);
      const viewBtn = linkedApp
        ? '<button class="btn btn-secondary" style="padding:5px 10px; font-size:12px;" onclick="openDetail(\'' + linkedApp.ApplicationID + '\')" data-i18n="personnel.viewFiles"></button>'
        : '';
      const deleteBtn = '<button class="btn btn-danger" style="padding:5px 10px; font-size:12px;" onclick="deletePersonnel(\'' + p.PersonnelID + '\', \'' + escapeHtml(p.FullName).replace(/'/g, "\\'") + '\')" data-i18n="common.delete"></button>';
      return '<tr>' +
        '<td><code style="font-size:12px;">' + escapeHtml(p.PersonnelID) + '</code></td>' +
        '<td>' + escapeHtml(p.FullName) + '</td>' +
        '<td>' + escapeHtml(groupName) + '</td>' +
        '<td><span class="badge badge-success">' + escapeHtml(p.Status) + '</span></td>' +
        '<td style="font-size:12px;">' + fmtDate(p.CreatedAt) + '</td>' +
        '<td style="white-space:nowrap;">' + viewBtn + ' ' + deleteBtn + '</td>' +
      '</tr>';
    }).join('');

    el.innerHTML = '<table class="data-table"><thead><tr>' +
      '<th>ID</th><th data-i18n="common.name"></th><th data-i18n="campaigns.group"></th>' +
      '<th data-i18n="common.status"></th><th data-i18n="common.createdAt"></th><th data-i18n="common.actions"></th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>';
    STSI18N.applyToDom();
  }

  function fmtDate(d) {
    if (!d) return '—';
    const date = new Date(d);
    if (isNaN(date.getTime())) return '—';
    return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  // ============================================================
  // RAPOR OLUŞTURUCU — filtrelenebilir, kolon seçilebilir PDF çıktısı
  // ============================================================

  function getReportValue(app, key, formFieldMaps) {
    const resolved = resolveGroupForApplication(app);
    switch (key) {
      case 'candidate': return (app.FolderName || '').replace(/_/g, ' ');
      case 'group': return resolved && resolved.group ? resolved.group.Name : '';
      case 'campaign': return resolved && resolved.campaign ? resolved.campaign.Name : '';
      case 'linkCode': return app.LinkCode || '';
      case 'status': return app.Status || '';
      case 'submittedAt': return fmtDate(app.SubmittedAt);
      case 'personnelId': return app.PersonnelID || '—';
      case 'phone': {
        if (!resolved || !resolved.campaign) return '';
        const fieldMap = formFieldMaps[resolved.campaign.FormID];
        if (!fieldMap) return '';
        const formData = JSON.parse(app.FormDataJSON || '{}');
        for (const fid in formData) {
          const f = fieldMap[fid];
          if (f && f.Type === 'Telefon') return formData[fid] || '';
        }
        return '';
      }
      default: return '';
    }
  }

  // PDF'te standart fontlar (Helvetica) sadece temel Latin karakterleri
  // destekler — ne Türkçe'ye özgü harfleri (ş,ğ,ı,İ,ö,ü,ç) ne de Kiril
  // alfabesini (Rusça vb.) düzgün gösterebilir. Bu yüzden PDF ÇIKTISI
  // İÇİN metni sade Latin harflere çeviriyoruz. Sistemin kendisinde
  // (ekranda, Sheets'te, Drive'da) veriler HER ZAMAN orijinal haliyle
  // kalır — bu dönüşüm SADECE indirilen PDF dosyası için uygulanır.
  const TR_MAP = { 'ş':'s','Ş':'S','ğ':'g','Ğ':'G','ı':'i','İ':'I','ö':'o','Ö':'O','ü':'u','Ü':'U','ç':'c','Ç':'C' };
  const CYRILLIC_MAP = {
    'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'zh','з':'z','и':'i','й':'y',
    'к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f',
    'х':'kh','ц':'ts','ч':'ch','ш':'sh','щ':'shch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya',
    'А':'A','Б':'B','В':'V','Г':'G','Д':'D','Е':'E','Ё':'Yo','Ж':'Zh','З':'Z','И':'I','Й':'Y',
    'К':'K','Л':'L','М':'M','Н':'N','О':'O','П':'P','Р':'R','С':'S','Т':'T','У':'U','Ф':'F',
    'Х':'Kh','Ц':'Ts','Ч':'Ch','Ш':'Sh','Щ':'Shch','Ъ':'','Ы':'Y','Ь':'','Э':'E','Ю':'Yu','Я':'Ya'
  };

  function sanitizeForPdf(str) {
    str = String(str == null ? '' : str);
    let out = '';
    for (let i = 0; i < str.length; i++) {
      const ch = str[i];
      if (TR_MAP[ch] !== undefined) out += TR_MAP[ch];
      else if (CYRILLIC_MAP[ch] !== undefined) out += CYRILLIC_MAP[ch];
      else out += ch;
    }
    return out;
  }

  // jsPDF çekirdeği ile (eklenti KULLANMADAN) elle basit bir tablo çizer.
  // Sayfa taşarsa otomatik yeni sayfa açar, başlığı tekrar çizer.
  function drawSimpleTable(doc, headers, rows) {
    const marginLeft = 14;
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const usableWidth = pageWidth - marginLeft * 2;
    const colWidth = usableWidth / headers.length;
    const rowHeight = 8;
    let y = 32;

    function drawHeaderRow() {
      doc.setFillColor(37, 99, 235);
      doc.setDrawColor(37, 99, 235);
      doc.rect(marginLeft, y, usableWidth, rowHeight, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(9);
      headers.forEach(function (h, i) {
        doc.text(h, marginLeft + i * colWidth + 2, y + rowHeight - 2.5);
      });
      y += rowHeight;
      doc.setTextColor(20, 20, 20);
      doc.setFontSize(8);
    }

    drawHeaderRow();

    rows.forEach(function (row, rIdx) {
      if (y + rowHeight > pageHeight - 15) {
        doc.addPage();
        y = 20;
        drawHeaderRow();
      }
      if (rIdx % 2 === 1) {
        doc.setFillColor(245, 247, 250);
        doc.rect(marginLeft, y, usableWidth, rowHeight, 'F');
      }
      const maxChars = Math.max(6, Math.floor(colWidth / 1.9));
      row.forEach(function (cell, i) {
        let text = String(cell == null ? '' : cell);
        if (text.length > maxChars) text = text.substring(0, maxChars - 1) + '…';
        doc.text(text, marginLeft + i * colWidth + 2, y + rowHeight - 2.5);
      });
      y += rowHeight;
    });

    // Tablo çerçevesi
    doc.setDrawColor(220, 220, 220);
  }

  // Rapor için PDF ve Excel'in ortak kullandığı filtre/kolon toplama
  function gatherReportSelection() {
    const selectedStatuses = Array.from(document.querySelectorAll('.report-status-cb:checked')).map(cb => cb.value);
    const selectedColumns = REPORT_COLUMNS.filter(c => {
      const cb = document.getElementById('report-col-' + c.key);
      return cb && cb.checked;
    });
    const filtered = selectedStatuses.length > 0
      ? applications.filter(a => selectedStatuses.indexOf(a.Status) !== -1)
      : applications;
    return { selectedColumns, filtered };
  }

  // Telefon kolonu seçiliyse ilgili formların alan tanımlarını önceden çeker
  async function buildFormFieldMapsIfNeeded(selectedColumns, filtered) {
    const formFieldMaps = {};
    if (!selectedColumns.some(c => c.key === 'phone')) return formFieldMaps;
    const distinctFormIds = new Set();
    filtered.forEach(app => {
      const resolved = resolveGroupForApplication(app);
      if (resolved && resolved.campaign) distinctFormIds.add(resolved.campaign.FormID);
    });
    for (const formId of distinctFormIds) {
      const res = await STSAPI.call('forms.get', { formId: formId });
      if (res.ok) {
        const map = {};
        res.data.fields.forEach(f => { map[f.FieldID] = f; });
        formFieldMaps[formId] = map;
      }
    }
    return formFieldMaps;
  }

  /**
   * Excel çıktısı — SheetJS ile üretilir. PDF'in aksine burada HİÇBİR
   * karakter dönüşümü YAPILMAZ: Excel dosyaları Unicode'u native olarak
   * destekler, bu yüzden Türkçe VE Kiril (Rusça) isimler/metinler
   * PDF'teki gibi sadeleştirilmeden, birebir doğru haliyle çıkar.
   * Kiril/çok dilli veri içeren raporlar için Excel önerilir.
   */
  async function generateReportExcel() {
    if (!window.XLSX) {
      alert(STSI18N.t('personnel.reportLibError'));
      return;
    }

    const { selectedColumns, filtered } = gatherReportSelection();

    if (selectedColumns.length === 0) {
      alert(STSI18N.t('personnel.reportNoColumns'));
      return;
    }
    if (filtered.length === 0) {
      alert(STSI18N.t('personnel.reportNoData'));
      return;
    }

    const formFieldMaps = await buildFormFieldMapsIfNeeded(selectedColumns, filtered);

    const headers = selectedColumns.map(c => STSI18N.t('personnel.reportCol.' + c.key));
    const rows = filtered.map(app => selectedColumns.map(c => getReportValue(app, c.key, formFieldMaps)));

    const wsData = [headers].concat(rows);
    const ws = XLSX.utils.aoa_to_sheet(wsData);

    // Kolon genişliklerini içeriğe göre otomatik ayarla
    ws['!cols'] = headers.map((h, i) => {
      const maxLen = rows.reduce((max, r) => Math.max(max, String(r[i] || '').length), h.length);
      return { wch: Math.min(40, maxLen + 3) };
    });

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Rapor');

    const filename = 'sts-dms-rapor-' + new Date().toISOString().slice(0, 10) + '.xlsx';
    XLSX.writeFile(wb, filename);
  }

  async function generateReportPdf() {
    if (!window.jspdf) {
      alert(STSI18N.t('personnel.reportLibError'));
      return;
    }

    const { selectedColumns, filtered } = gatherReportSelection();

    if (selectedColumns.length === 0) {
      alert(STSI18N.t('personnel.reportNoColumns'));
      return;
    }
    if (filtered.length === 0) {
      alert(STSI18N.t('personnel.reportNoData'));
      return;
    }

    const formFieldMaps = await buildFormFieldMapsIfNeeded(selectedColumns, filtered);

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.setFontSize(14);
    doc.setTextColor(20, 20, 20);
    doc.text(sanitizeForPdf(STSI18N.t('personnel.reportPdfTitle')), 14, 15);
    doc.setFontSize(9);
    doc.setTextColor(120, 120, 120);
    doc.text(sanitizeForPdf(STSI18N.t('personnel.reportPdfGenerated')) + ' ' + new Date().toLocaleString(), 14, 21);
    doc.text(sanitizeForPdf(STSI18N.t('personnel.reportPdfCount')) + ' ' + filtered.length, 14, 26);

    const headers = selectedColumns.map(c => sanitizeForPdf(STSI18N.t('personnel.reportCol.' + c.key)));
    const rows = filtered.map(app => selectedColumns.map(c => sanitizeForPdf(getReportValue(app, c.key, formFieldMaps))));

    drawSimpleTable(doc, headers, rows);

    const filename = 'sts-dms-rapor-' + new Date().toISOString().slice(0, 10) + '.pdf';
    doc.save(filename);
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
</script>
