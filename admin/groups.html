<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STS-DMS — Gruplar</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>

<div id="app-shell"></div>

<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/loading.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
  let groups = [];
  let editingGroupId = null;
  let showInactive = false;

  (async function () {
    await STSI18N.init();
    STSLayout.render({ activeNav: 'groups', eyebrow: 'dashboard.eyebrow', title: 'groups.title' });
    STSI18N.onChange(fullRerender);
    await loadGroups();
    fullRerender();
  })();

  async function loadGroups() {
    const result = await STSAPI.call('groups.list');
    groups = result.ok ? result.data : [];
  }

  function fullRerender() {
    const content = document.getElementById('page-content');
    content.innerHTML =
      '<div class="card">' +
        '<div class="card-header">' +
          '<div>' +
            '<p class="card-title" data-i18n="groups.title"></p>' +
            '<p class="card-subtitle" data-i18n="groups.subtitle"></p>' +
          '</div>' +
        '</div>' +
        '<div class="field"><label data-i18n="common.name"></label><input type="text" id="g-name" placeholder="örn. FORMEN"></div>' +
        '<div class="field"><label data-i18n="common.description"></label><input type="text" id="g-desc"></div>' +
        '<div style="display:flex; justify-content:flex-end; gap:10px;">' +
          '<button class="btn btn-secondary" data-i18n="common.cancel" onclick="resetForm()" id="cancel-edit-btn" style="' + (editingGroupId ? '' : 'display:none;') + '"></button>' +
          '<button class="btn btn-primary" id="save-group-btn" onclick="saveGroup()"></button>' +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-header">' +
          '<div>' +
            '<p class="card-title" data-i18n="groups.existing"></p>' +
            '<p class="card-subtitle" data-i18n="groups.existingDesc"></p>' +
          '</div>' +
          '<div style="display:flex; align-items:center; gap:12px;">' +
            '<label class="checkbox-row" style="margin:0;"><input type="checkbox" id="show-inactive-toggle" ' + (showInactive ? 'checked' : '') + ' onchange="toggleShowInactive()"> <span data-i18n="common.showInactive"></span></label>' +
            '<button class="btn btn-secondary" data-i18n="forms.refresh" onclick="refreshList()"></button>' +
          '</div>' +
        '</div>' +
        '<div id="groups-list-area"></div>' +
      '</div>';

    STSI18N.applyToDom();
    document.getElementById('save-group-btn').textContent = editingGroupId ? STSI18N.t('common.save') : STSI18N.t('common.create');
    renderGroupsList();
  }

  async function saveGroup() {
    const name = document.getElementById('g-name').value.trim();
    const description = document.getElementById('g-desc').value.trim();
    if (!name) { alert(STSI18N.t('groups.nameRequired')); return; }

    let result;
    if (editingGroupId) {
      result = await STSAPI.call('groups.update', { groupId: editingGroupId, name: name, description: description });
    } else {
      result = await STSAPI.call('groups.create', { name: name, description: description });
    }

    if (result.ok) {
      editingGroupId = null;
      await loadGroups();
      fullRerender();
    } else {
      alert(result.error || STSI18N.t('common.error.generic'));
    }
  }

  function editGroup(groupId) {
    const g = groups.find(x => x.GroupID === groupId);
    if (!g) return;
    editingGroupId = groupId;
    fullRerender();
    document.getElementById('g-name').value = g.Name;
    document.getElementById('g-desc').value = g.Description || '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetForm() {
    editingGroupId = null;
    fullRerender();
  }

  async function toggleGroupStatus(groupId, newStatus) {
    const result = await STSAPI.call('groups.update', { groupId: groupId, status: newStatus });
    if (result.ok) { await loadGroups(); renderGroupsList(); }
    else alert(result.error || STSI18N.t('common.error.generic'));
  }

  async function deleteGroup(groupId, name) {
    if (!confirm(STSI18N.t('common.deleteConfirm') + '\n\n' + name)) return;
    const result = await STSAPI.call('groups.delete', { groupId: groupId });
    if (result.ok) {
      await loadGroups();
      renderGroupsList();
    } else {
      alert(result.error || STSI18N.t('common.error.generic'));
    }
  }

  function toggleShowInactive() {
    showInactive = document.getElementById('show-inactive-toggle').checked;
    renderGroupsList();
  }

  async function refreshList() {
    await loadGroups();
    fullRerender();
  }

  function renderGroupsList() {
    const el = document.getElementById('groups-list-area');
    const visible = showInactive ? groups : groups.filter(g => g.Status === 'Aktif');

    if (visible.length === 0) {
      el.innerHTML = '<div class="empty-state" data-i18n="groups.noGroups"></div>';
      STSI18N.applyToDom();
      return;
    }

    const rows = visible.map(g => {
      const badgeClass = g.Status === 'Aktif' ? 'badge-success' : 'badge-neutral';
      const deleteBtn = g.Status === 'Pasif'
        ? '<button class="btn btn-danger" style="padding:5px 10px; font-size:12px;" onclick="deleteGroup(\'' + g.GroupID + '\', \'' + escapeHtml(g.Name).replace(/'/g, "\\'") + '\')" data-i18n="common.delete"></button>'
        : '';
      return '<tr>' +
        '<td>' + escapeHtml(g.Name) + '</td>' +
        '<td>' + escapeHtml(g.Description || '') + '</td>' +
        '<td><span class="badge ' + badgeClass + '">' + g.Status + '</span></td>' +
        '<td style="font-size:12px; color:var(--text-secondary);">' + escapeHtml(g.CreatedBy || '') + '<br>' + fmtDate(g.CreatedAt) + '</td>' +
        '<td style="white-space:nowrap;">' +
          '<button class="btn btn-secondary" style="padding:5px 10px; font-size:12px;" onclick="editGroup(\'' + g.GroupID + '\')">' + STSI18N.t('common.edit') + '</button> ' +
          '<button class="btn btn-secondary" style="padding:5px 10px; font-size:12px;" onclick="toggleGroupStatus(\'' + g.GroupID + '\', \'' + (g.Status === 'Aktif' ? 'Pasif' : 'Aktif') + '\')">' +
            (g.Status === 'Aktif' ? STSI18N.t('common.inactive') : STSI18N.t('common.active')) +
          '</button> ' + deleteBtn +
        '</td>' +
      '</tr>';
    }).join('');

    el.innerHTML = '<table class="data-table"><thead><tr>' +
      '<th data-i18n="common.name"></th><th data-i18n="common.description"></th><th data-i18n="common.status"></th>' +
      '<th data-i18n="common.createdBy"></th><th data-i18n="common.actions"></th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>';
    STSI18N.applyToDom();
  }

  function fmtDate(d) {
    if (!d) return '—';
    const date = new Date(d);
    if (isNaN(date.getTime())) return '—';
    return date.toLocaleDateString();
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
</script>

</body>
</html>
