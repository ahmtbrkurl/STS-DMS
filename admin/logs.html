<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STS-DMS — İşlem Logları</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>

<div id="app-shell"></div>

<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/loading.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
  let logs = [];
  let actionFilter = '';
  let currentPage = 1;
  const PAGE_SIZE = 10;

  (async function () {
    await STSI18N.init();
    STSLayout.render({ activeNav: 'logs', eyebrow: 'dashboard.eyebrow', title: 'logs.title' });
    STSI18N.onChange(fullRerender);
    await loadLogs();
    fullRerender();
  })();

  async function loadLogs() {
    const result = await STSAPI.call('logs.list');
    logs = result.ok ? result.data : [];
  }

  function fullRerender() {
    const content = document.getElementById('page-content');

    const uniqueActions = Array.from(new Set(logs.map(l => l.Action))).sort();

    content.innerHTML =
      '<div class="card">' +
        '<div class="card-header">' +
          '<div>' +
            '<p class="card-title" data-i18n="logs.title"></p>' +
            '<p class="card-subtitle" data-i18n="logs.subtitle"></p>' +
          '</div>' +
          '<div style="display:flex; align-items:center; gap:10px;">' +
            '<select id="action-filter" onchange="onFilterChange()" style="padding:8px 10px; border-radius:6px; border:1px solid var(--surface-border); font-size:13px;">' +
              '<option value="">' + STSI18N.t('logs.allActions') + '</option>' +
              uniqueActions.map(a => '<option value="' + a + '"' + (a === actionFilter ? ' selected' : '') + '>' + a + '</option>').join('') +
            '</select>' +
            '<button class="btn btn-secondary" data-i18n="forms.refresh" onclick="refreshLogs()"></button>' +
          '</div>' +
        '</div>' +
        '<div id="logs-list-area"></div>' +
        '<div id="pagination-area"></div>' +
      '</div>';

    STSI18N.applyToDom();
    renderLogsList();
  }

  function onFilterChange() {
    actionFilter = document.getElementById('action-filter').value;
    currentPage = 1;
    renderLogsList();
  }

  function goToPage(page) {
    currentPage = page;
    renderLogsList();
    document.getElementById('logs-list-area').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  async function refreshLogs() {
    await loadLogs();
    fullRerender();
  }

  function actionBadgeClass(action) {
    if (action.indexOf('Delete') !== -1) return 'badge-danger';
    if (action.indexOf('Create') !== -1) return 'badge-success';
    if (action.indexOf('Update') !== -1 || action.indexOf('Toggle') !== -1) return 'badge-info';
    if (action.indexOf('Login') !== -1) return 'badge-neutral';
    return 'badge-neutral';
  }

  function renderLogsList() {
    const el = document.getElementById('logs-list-area');
    const pagerEl = document.getElementById('pagination-area');

    const filtered = actionFilter ? logs.filter(l => l.Action === actionFilter) : logs;

    if (filtered.length === 0) {
      el.innerHTML = '<div class="empty-state" data-i18n="logs.noLogs"></div>';
      pagerEl.innerHTML = '';
      STSI18N.applyToDom();
      return;
    }

    const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
    const pageItems = filtered.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

    const rows = pageItems.map(l => {
      return '<tr>' +
        '<td style="font-size:12px; white-space:nowrap;">' + fmtDate(l.Timestamp) + '</td>' +
        '<td>' + escapeHtml(l.UserRef || '—') + '<br><span style="font-size:11px; color:var(--text-muted);">' + escapeHtml(l.UserType || '') + '</span></td>' +
        '<td><span class="badge ' + actionBadgeClass(l.Action) + '">' + escapeHtml(l.Action) + '</span></td>' +
        '<td style="font-size:12px;">' + escapeHtml(l.TargetRef || '—') + '</td>' +
        '<td style="font-size:12px; color:var(--text-secondary);">' + escapeHtml(l.Description || '') + '</td>' +
      '</tr>';
    }).join('');

    el.innerHTML = '<table class="data-table"><thead><tr>' +
      '<th data-i18n="logs.timestamp"></th><th data-i18n="logs.user"></th><th data-i18n="logs.action"></th>' +
      '<th data-i18n="logs.target"></th><th data-i18n="logs.description"></th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>';

    if (totalPages > 1) {
      let pagerHtml = '<div class="pagination-bar">';
      pagerHtml += '<button class="btn btn-secondary" style="padding:5px 10px; font-size:12px;" ' + (currentPage === 1 ? 'disabled' : '') + ' onclick="goToPage(' + (currentPage - 1) + ')">‹</button>';
      pagerHtml += '<span class="pagination-info">' + currentPage + ' / ' + totalPages + '</span>';
      pagerHtml += '<button class="btn btn-secondary" style="padding:5px 10px; font-size:12px;" ' + (currentPage === totalPages ? 'disabled' : '') + ' onclick="goToPage(' + (currentPage + 1) + ')">›</button>';
      pagerHtml += '</div>';
      pagerEl.innerHTML = pagerHtml;
    } else {
      pagerEl.innerHTML = '';
    }

    STSI18N.applyToDom();
  }

  function fmtDate(d) {
    if (!d) return '—';
    const date = new Date(d);
    if (isNaN(date.getTime())) return '—';
    return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
</script>

<style>
  .pagination-bar { display:flex; align-items:center; justify-content:center; gap:14px; padding:16px 0 4px; }
  .pagination-info { font-size:13px; color:var(--text-secondary); font-weight:500; }
</style>

</body>
</html>
