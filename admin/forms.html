<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STS-DMS — Form Tasarımı</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>

<div id="app-shell"></div>

<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/layout.js"></script>
<script>

  // ============================================================
  // ALAN varsayılan özellikleri, İMZA dahil
  // ============================================================
  const FIELD_TYPES = [
    { type: 'Metin', icon: '📝' },
    { type: 'Tarih', icon: '📅' },
    { type: 'Telefon', icon: '📱' },
    { type: 'E-posta', icon: '✉️' },
    { type: 'KimlikNo', icon: '🪪' },
    { type: 'PasaportNo', icon: '🛂' },
    { type: 'Belge', icon: '📎' },
    { type: 'Fotoğraf', icon: '📷' },
    { type: 'AçılırListe', icon: '⬇️' },
    { type: 'Onay', icon: '☑️' },
    { type: 'İmza', icon: '✍️' }
  ];
  const FILE_TYPES = ['Belge', 'Fotoğraf', 'İmza'];

  let groups = [];
  let existingForms = [];
  let fields = [];         // aktif düzenlenen formun alanları
  let selectedIndex = -1;  // Alan Özellikleri panelinde seçili alan
  let editingFormId = null; // null ise yeni form, doluysa mevcut formu güncelliyoruz
  let dragFromIndex = null;

  (async function () {
    await STSI18N.init();
    STSLayout.render({ activeNav: 'forms', eyebrow: 'dashboard.eyebrow', title: 'forms.title' });
    STSI18N.onChange(fullRerender);
    await loadGroups();
    await loadExistingForms();
    fullRerender();
  })();

  async function loadGroups() {
    const res = await STSAPI.call('groups.list');
    groups = res.ok ? res.data : [];
  }

  async function loadExistingForms() {
    const res = await STSAPI.call('forms.list');
    existingForms = res.ok ? res.data : [];
  }

  // ============================================================
  // ANA RENDER
  // ============================================================
  function fullRerender() {
    const content = document.getElementById('page-content');
    content.innerHTML =
      '<div class="card">' +
        '<div class="card-header">' +
          '<div>' +
            '<p class="card-title" data-i18n="forms.title"></p>' +
            '<p class="card-subtitle" data-i18n="forms.subtitle"></p>' +
          '</div>' +
        '</div>' +

        '<div class="field-row" style="display:grid; grid-template-columns:1fr 1fr 120px; gap:16px; margin-bottom:20px;">' +
          '<div class="field" style="margin:0;">' +
            '<label data-i18n="forms.group"></label>' +
            '<select id="f-group"></select>' +
          '</div>' +
          '<div class="field" style="margin:0;">' +
            '<label data-i18n="forms.formName"></label>' +
            '<input type="text" id="f-name">' +
          '</div>' +
          '<div class="field" style="margin:0;">' +
            '<label data-i18n="forms.version"></label>' +
            '<input type="text" id="f-version" value="1.0">' +
          '</div>' +
        '</div>' +

        '<div class="form-builder-grid">' +
          '<div id="field-palette"></div>' +
          '<div>' +
            '<div class="builder-canvas" id="builder-canvas"></div>' +
          '</div>' +
          '<div class="props-panel" id="props-panel"></div>' +
        '</div>' +

        '<div class="field" style="margin-top:20px;">' +
          '<label data-i18n="forms.folderTemplate"></label>' +
          '<input type="text" id="f-template" placeholder="{Ad}_{Soyad}_{TCSon4}">' +
          '<div style="margin-top:6px; font-size:12px; color:var(--text-muted);" data-i18n="forms.folderTemplateHint"></div>' +
          '<div id="template-tokens" style="margin-top:6px;"></div>' +
        '</div>' +

        '<div style="display:flex; justify-content:flex-end; gap:10px; margin-top:16px;">' +
          '<button class="btn btn-secondary" data-i18n="forms.preview" onclick="previewForm()"></button>' +
          '<button class="btn btn-primary" data-i18n="forms.saveForm" onclick="saveForm()"></button>' +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-header">' +
          '<div>' +
            '<p class="card-title" data-i18n="forms.existingForms"></p>' +
            '<p class="card-subtitle" data-i18n="forms.existingFormsDesc"></p>' +
          '</div>' +
          '<button class="btn btn-secondary" data-i18n="forms.refresh" onclick="refreshFormsList()"></button>' +
        '</div>' +
        '<div id="forms-list-area"></div>' +
      '</div>';

    STSI18N.applyToDom();
    renderGroupSelect();
    renderPalette();
    renderCanvas();
    renderProps();
    renderTemplateTokens();
    renderFormsList();

    document.getElementById('f-template').value = document.getElementById('f-template').value || '';
  }

  function renderGroupSelect() {
    const sel = document.getElementById('f-group');
    const current = sel.value;
    sel.innerHTML = groups
      .filter(g => g.Status === 'Aktif')
      .map(g => '<option value="' + g.GroupID + '">' + g.Name + '</option>')
      .join('');
    if (current) sel.value = current;
  }

  function renderPalette() {
    const el = document.getElementById('field-palette');
    el.innerHTML = FIELD_TYPES.map(ft =>
      '<button type="button" class="field-type-btn" onclick="addField(\'' + ft.type + '\')">' +
        '<span>' + ft.icon + '</span><span data-i18n="fieldtype.' + ft.type + '"></span>' +
      '</button>'
    ).join('');
    STSI18N.applyToDom();
  }

  function renderCanvas() {
    const el = document.getElementById('builder-canvas');
    if (fields.length === 0) {
      el.innerHTML = '<div class="props-empty" data-i18n="forms.dropHint"></div>';
      STSI18N.applyToDom();
      return;
    }
    el.innerHTML = fields.map((f, i) => {
      const selectedClass = (i === selectedIndex) ? ' selected' : '';
      const label = f.label || STSI18N.t('fieldtype.' + f.type);
      const req = f.required ? ' *' : '';
      return '<div class="field-card' + selectedClass + '" draggable="true" ' +
        'ondragstart="onDragStart(' + i + ')" ondragover="onDragOver(event)" ondrop="onDrop(' + i + ')" ' +
        'onclick="selectField(' + i + ')">' +
        '<span class="drag-handle">⠿</span>' +
        '<div class="field-info">' +
          '<div class="field-label">' + escapeHtml(label) + req + '</div>' +
          '<div class="field-meta">' + STSI18N.t('fieldtype.' + f.type) + '</div>' +
        '</div>' +
        '<button type="button" class="remove-btn" onclick="event.stopPropagation(); removeField(' + i + ')">✕</button>' +
      '</div>';
    }).join('');
  }

  function renderProps() {
    const el = document.getElementById('props-panel');
    if (selectedIndex === -1 || !fields[selectedIndex]) {
      el.innerHTML = '<p class="card-title" data-i18n="forms.fieldProperties" style="font-size:14px;"></p>' +
        '<div class="props-empty" data-i18n="forms.selectFieldHint"></div>';
      STSI18N.applyToDom();
      return;
    }

    const f = fields[selectedIndex];
    const isFileType = FILE_TYPES.indexOf(f.type) !== -1;
    const isDropdown = f.type === 'AçılırListe';

    let html = '<p class="card-title" style="font-size:14px;">' + STSI18N.t('forms.fieldProperties') + '</p>';

    html += '<div class="field"><label>' + STSI18N.t('forms.fieldLabel') + '</label>' +
      '<input type="text" id="prop-label" value="' + escapeAttr(f.label || '') + '" oninput="updateSelectedField(\'label\', this.value)"></div>';

    html += '<div class="checkbox-row">' +
      '<input type="checkbox" id="prop-required" ' + (f.required ? 'checked' : '') + ' onchange="updateSelectedField(\'required\', this.checked)">' +
      '<label for="prop-required">' + STSI18N.t('forms.required') + '</label></div>';

    if (isDropdown) {
      html += '<div class="field"><label>' + STSI18N.t('forms.options') + '</label>' +
        '<input type="text" id="prop-options" value="' + escapeAttr(f.options || '') + '" placeholder="Seçenek1, Seçenek2" oninput="updateSelectedField(\'options\', this.value)"></div>';
    }

    if (isFileType) {
      html += '<div class="field"><label>' + STSI18N.t('forms.fileLabel') + '</label>' +
        '<input type="text" id="prop-filelabel" value="' + escapeAttr(f.fileLabel || '') + '" placeholder="örn. Kimlik" oninput="updateSelectedField(\'fileLabel\', this.value)">' +
        '<div style="font-size:11px; color:var(--text-muted); margin-top:4px;">' + STSI18N.t('forms.fileLabelHint') + '</div></div>';
      if (f.type === 'İmza') {
        html += '<div style="font-size:12px; margin-top:8px; margin-bottom:8px;" class="signature-preview-ink">✍️ Mavi kalem, transparan PNG</div>';
      } else {
        if (f.type === 'Belge') {
          html += '<div class="checkbox-row">' +
            '<input type="checkbox" id="prop-twosided" ' + (f.twoSided ? 'checked' : '') + ' onchange="updateSelectedField(\'twoSided\', this.checked)">' +
            '<label for="prop-twosided">' + STSI18N.t('forms.twoSided') + '</label></div>' +
            '<div style="font-size:11px; color:var(--text-muted); margin-bottom:8px;">' + STSI18N.t('forms.twoSidedHint') + '</div>';
        }
        if (f.type === 'Fotoğraf') {
          html += '<div class="checkbox-row">' +
            '<input type="checkbox" id="prop-vesikalik" ' + (f.vesikalikMode ? 'checked' : '') + ' onchange="updateSelectedField(\'vesikalikMode\', this.checked)">' +
            '<label for="prop-vesikalik">' + STSI18N.t('forms.vesikalikMode') + '</label></div>' +
            '<div style="font-size:11px; color:var(--text-muted); margin-bottom:8px;">' + STSI18N.t('forms.vesikalikModeHint') + '</div>';
        }
        html += renderTemplateFileSection(f);
      }
    } else {
      html += '<div class="checkbox-row">' +
        '<input type="checkbox" id="prop-folder" ' + (f.usedInFolderName ? 'checked' : '') + ' onchange="updateSelectedField(\'usedInFolderName\', this.checked)">' +
        '<label for="prop-folder">' + STSI18N.t('forms.usedInFolderName') + '</label></div>';
    }

    html += '<button type="button" class="btn btn-danger" style="width:100%; justify-content:center; margin-top:10px;" onclick="removeField(' + selectedIndex + ')">' +
      STSI18N.t('forms.removeField') + '</button>';

    el.innerHTML = html;
  }

  function renderTemplateTokens() {
    const el = document.getElementById('template-tokens');
    const labelTokens = fields
      .filter(f => !FILE_TYPES.includes(f.type) && f.label)
      .map(f => '<span class="token-chip" onclick="insertToken(\'{' + f.label + '}\')">{' + escapeHtml(f.label) + '}</span>');
    const specialTokens = ['<span class="token-chip" onclick="insertToken(\'{TCSon4}\')">{TCSon4}</span>',
                            '<span class="token-chip" onclick="insertToken(\'{PasaportSon4}\')">{PasaportSon4}</span>'];
    el.innerHTML = labelTokens.concat(specialTokens).join('');
  }

  function renderFormsList() {
    const el = document.getElementById('forms-list-area');
    if (existingForms.length === 0) {
      el.innerHTML = '<div class="empty-state" data-i18n="forms.noForms"></div>';
      STSI18N.applyToDom();
      return;
    }
    const rows = existingForms.map(f => {
      const groupName = (groups.find(g => g.GroupID === f.GroupID) || {}).Name || f.GroupID;
      const badgeClass = f.Status === 'Aktif' ? 'badge-success' : 'badge-neutral';
      return '<tr>' +
        '<td>' + escapeHtml(f.Name) + '</td>' +
        '<td>' + escapeHtml(groupName) + '</td>' +
        '<td>' + escapeHtml(f.Version || '') + '</td>' +
        '<td><span class="badge ' + badgeClass + '">' + f.Status + '</span></td>' +
        '<td>' +
          '<button class="btn btn-secondary" style="padding:5px 10px; font-size:12px;" onclick="loadFormForEdit(\'' + f.FormID + '\')">' + STSI18N.t('forms.editForm') + '</button> ' +
          '<button class="btn btn-secondary" style="padding:5px 10px; font-size:12px;" onclick="toggleFormStatus(\'' + f.FormID + '\', \'' + (f.Status === 'Aktif' ? 'Pasif' : 'Aktif') + '\')">' +
            (f.Status === 'Aktif' ? STSI18N.t('common.inactive') : STSI18N.t('common.active')) +
          '</button>' +
        '</td>' +
      '</tr>';
    }).join('');

    el.innerHTML = '<table class="data-table"><thead><tr>' +
      '<th data-i18n="common.name"></th><th data-i18n="forms.group"></th><th data-i18n="forms.version"></th>' +
      '<th data-i18n="common.status"></th><th data-i18n="common.actions"></th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>';
    STSI18N.applyToDom();
  }

  // ============================================================
  // ALAN İŞLEMLERİ
  // ============================================================
  function addField(type) {
    fields.push({
      fieldId: null,
      type: type,
      label: '',
      required: false,
      order: fields.length,
      options: '',
      usedInFolderName: false,
      fileLabel: '',
      templateFileId: '',
      templateFileName: '',
      templateFileUrl: '',
      twoSided: false,
      vesikalikMode: false
    });
    selectedIndex = fields.length - 1;
    renderCanvas();
    renderProps();
    renderTemplateTokens();
  }

  function selectField(i) {
    selectedIndex = i;
    renderCanvas();
    renderProps();
  }

  function updateSelectedField(key, value) {
    if (selectedIndex === -1) return;
    fields[selectedIndex][key] = value;
    renderCanvas();
    renderTemplateTokens();
  }

  function removeField(i) {
    fields.splice(i, 1);
    fields.forEach((f, idx) => f.order = idx);
    selectedIndex = -1;
    renderCanvas();
    renderProps();
    renderTemplateTokens();
  }

  function onDragStart(i) { dragFromIndex = i; }
  function onDragOver(e) { e.preventDefault(); }
  function onDrop(i) {
    if (dragFromIndex === null || dragFromIndex === i) return;
    const moved = fields.splice(dragFromIndex, 1)[0];
    fields.splice(i, 0, moved);
    fields.forEach((f, idx) => f.order = idx);
    selectedIndex = i;
    dragFromIndex = null;
    renderCanvas();
    renderProps();
  }

  function insertToken(token) {
    const input = document.getElementById('f-template');
    input.value = (input.value || '') + token;
  }

  // ============================================================
  // KAYDETME / DÜZENLEME
  // ============================================================
  function collectFormPayload() {
    return {
      groupId: document.getElementById('f-group').value,
      name: document.getElementById('f-name').value.trim(),
      version: document.getElementById('f-version').value.trim() || '1.0',
      folderNamingTemplate: document.getElementById('f-template').value.trim(),
      fields: fields.map(f => ({
        type: f.type, label: f.label, required: !!f.required, order: f.order,
        options: f.options, usedInFolderName: !!f.usedInFolderName, fileLabel: f.fileLabel,
        templateFileId: f.templateFileId || '', templateFileName: f.templateFileName || '',
        templateFileUrl: f.templateFileUrl || '', twoSided: !!f.twoSided, vesikalikMode: !!f.vesikalikMode
      }))
    };
  }

  async function saveForm() {
    const payload = collectFormPayload();
    if (!payload.groupId) { alert(STSI18N.t('forms.selectGroupFirst')); return; }
    if (!payload.name) { alert(STSI18N.t('forms.nameRequired')); return; }

    let result;
    if (editingFormId) {
      // Önce form meta bilgisi güncellenir, sonra alanlar topluca değiştirilir
      result = await STSAPI.call('forms.update', {
        formId: editingFormId, name: payload.name, version: payload.version,
        folderNamingTemplate: payload.folderNamingTemplate
      });
      if (result.ok) {
        result = await STSAPI.call('forms.updateFields', { formId: editingFormId, fields: payload.fields });
      }
    } else {
      result = await STSAPI.call('forms.create', payload);
    }

    if (result.ok) {
      alert(STSI18N.t('forms.saved'));
      editingFormId = null;
      fields = [];
      selectedIndex = -1;
      document.getElementById('f-name').value = '';
      document.getElementById('f-template').value = '';
      await loadExistingForms();
      fullRerender();
    } else {
      alert(result.error || STSI18N.t('common.error.generic'));
    }
  }

  async function loadFormForEdit(formId) {
    const result = await STSAPI.call('forms.get', { formId: formId });
    if (!result.ok) { alert(result.error); return; }

    const form = result.data;
    editingFormId = form.FormID;
    fields = (form.fields || []).map(f => ({
      fieldId: f.FieldID, type: f.Type, label: f.Label, required: f.Required === true || f.Required === 'TRUE',
      order: f.Order, options: f.Options, usedInFolderName: f.UsedInFolderName === true || f.UsedInFolderName === 'TRUE',
      fileLabel: f.FileLabel,
      templateFileId: f.TemplateFileId || '', templateFileName: f.TemplateFileName || '', templateFileUrl: f.TemplateFileUrl || '',
      twoSided: f.TwoSided === true || f.TwoSided === 'TRUE',
      vesikalikMode: f.VesikalikMode === true || f.VesikalikMode === 'TRUE'
    }));
    selectedIndex = -1;

    fullRerender();
    document.getElementById('f-group').value = form.GroupID;
    document.getElementById('f-name').value = form.Name;
    document.getElementById('f-version').value = form.Version;
    document.getElementById('f-template').value = form.FolderNamingTemplate || '';

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function toggleFormStatus(formId, newStatus) {
    const result = await STSAPI.call('forms.update', { formId: formId, status: newStatus });
    if (result.ok) {
      await loadExistingForms();
      renderFormsList();
    } else {
      alert(result.error || STSI18N.t('common.error.generic'));
    }
  }

  async function refreshFormsList() {
    await loadExistingForms();
    renderFormsList();
  }

  function previewForm() {
    const payload = collectFormPayload();
    let msg = payload.name + ' (' + payload.version + ')\n\n';
    payload.fields.forEach(f => {
      msg += '• ' + (f.label || STSI18N.t('fieldtype.' + f.type)) + ' [' + STSI18N.t('fieldtype.' + f.type) + ']' + (f.required ? ' *' : '') + '\n';
    });
    alert(msg);
  }

  function renderTemplateFileSection(f) {
    let html = '<div class="field" style="border-top:1px solid var(--surface-border); padding-top:12px; margin-top:4px;">';
    html += '<label>' + STSI18N.t('forms.templateFile') + '</label>';
    html += '<div style="font-size:11px; color:var(--text-muted); margin-bottom:8px;">' + STSI18N.t('forms.templateFileHint') + '</div>';

    if (f.templateFileId && f.templateFileName) {
      html += '<div style="display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--surface-bg); border-radius:6px; margin-bottom:8px;">' +
        '<span style="flex:1; font-size:13px;">📄 ' + escapeHtml(f.templateFileName) + '</span>' +
        '<button type="button" class="btn btn-secondary" style="padding:4px 8px; font-size:11px;" onclick="removeTemplateFile()">✕</button>' +
      '</div>';
    } else {
      html += '<input type="file" id="prop-template-input" onchange="handleTemplateFileUpload(event)">';
      html += '<div id="template-upload-status" style="font-size:11px; color:var(--text-muted); margin-top:4px;"></div>';
    }

    html += '</div>';
    return html;
  }

  async function handleTemplateFileUpload(event) {
    const file = event.target.files[0];
    if (!file || selectedIndex === -1) return;

    const statusEl = document.getElementById('template-upload-status');
    statusEl.textContent = STSI18N.t('common.loading');

    const reader = new FileReader();
    reader.onload = async function () {
      const base64 = reader.result.split(',')[1];
      const result = await STSAPI.call('templates.upload', {
        fileBase64: base64,
        fileName: file.name,
        mimeType: file.type
      });

      if (result.ok) {
        fields[selectedIndex].templateFileId = result.fileId;
        fields[selectedIndex].templateFileName = result.fileName;
        fields[selectedIndex].templateFileUrl = result.url;
        renderProps();
      } else {
        statusEl.textContent = result.error || STSI18N.t('common.error.generic');
      }
    };
    reader.readAsDataURL(file);
  }

  function removeTemplateFile() {
    if (selectedIndex === -1) return;
    const f = fields[selectedIndex];
    if (f.templateFileId) {
      STSAPI.call('templates.delete', { fileId: f.templateFileId });
    }
    f.templateFileId = '';
    f.templateFileName = '';
    f.templateFileUrl = '';
    renderProps();
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function escapeAttr(str) { return escapeHtml(str); }

</script>

</body>
</html>
