<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STS-DMS — Başvuru Düzenleme</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/apply.css">
</head>
<body>

<div class="apply-shell" id="apply-root">
  <div class="apply-header">
    <div class="badge-mark">STS</div>
  </div>
  <div class="apply-lang-switch lang-switch" id="lang-switch">
    <button data-lang="TR" onclick="changeLang('TR')">TR</button>
    <button data-lang="RU" onclick="changeLang('RU')">RU</button>
    <button data-lang="EN" onclick="changeLang('EN')">EN</button>
  </div>
  <div id="apply-content">
    <div class="empty-state" data-i18n="apply.loading"></div>
  </div>
</div>

<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/loading.js"></script>
<script src="../assets/js/id-capture.js"></script>
<script src="../assets/js/apply-form.js"></script>
<script>
  const BASE_URL = 'https://script.google.com/macros/s/AKfycbzztkmZ4T4BbxxrD2-0fxK7I8s77nyBcRA49kfjLg1G7JDe_MQszFnTj-0JjKPIaQJx3g/exec';

  let editToken = null;
  let currentForm = null;
  let rejectedFields = [];
  let formCtl = null;
  let lastState = 'loading';

  async function callApi(payload) {
    if (window.STSLoading) STSLoading.show();
    let res, text;
    try {
      res = await fetch(BASE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      text = await res.text();
    } catch (e) {
      if (window.STSLoading) STSLoading.hide();
      return { ok: false, error: 'Sunucuya ulaşılamıyor. İnternet bağlantınızı kontrol edin.' };
    }
    if (window.STSLoading) STSLoading.hide();
    try { return JSON.parse(text); } catch (e) { return { ok: false, error: 'Sunucudan geçersiz yanıt.' }; }
  }

  function changeLang(lang) {
    STSI18N.setLanguage(lang).then(renderCurrentState);
  }

  function getTokenFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get('token');
  }

  async function init() {
    await STSI18N.init();
    STSI18N.applyToDom();

    editToken = getTokenFromUrl();
    if (!editToken) {
      showBlocked(STSI18N.t('apply.error.noToken'));
      return;
    }

    const result = await callApi({ action: 'application.editInfo', editToken: editToken });
    if (!result.ok) {
      showBlocked(result.error || STSI18N.t('apply.error.generic'));
      return;
    }

    currentForm = result.form;
    rejectedFields = result.rejectedFields || [];
    lastState = 'form';
    renderCurrentState();
  }

  function renderCurrentState() {
    if (lastState === 'form' && currentForm) {
      renderFormScreen();
    }
  }

  function showBlocked(message) {
    lastState = 'blocked';
    document.getElementById('apply-content').innerHTML =
      '<div class="apply-blocked-screen">' +
        '<div class="apply-success-icon" style="background:var(--status-danger-bg); color:var(--status-danger-text);">⚠</div>' +
        '<p style="font-size:15px; color:var(--text-primary); font-weight:600; margin-bottom:6px;">' + escapeHtml(message) + '</p>' +
      '</div>';
  }

  function renderFormScreen() {
    const content = document.getElementById('apply-content');

    let rejectedHtml = '';
    if (rejectedFields.length > 0) {
      rejectedHtml = '<div class="apply-error-banner show" style="background:var(--status-warning-bg); color:var(--status-warning-text);">' +
        '⚠ ' + escapeHtml(rejectedFields.join(', ')) + ' — ' + STSI18N.t('apply.rejectedGeneral') +
      '</div>';
    }

    content.innerHTML =
      '<div class="card">' +
        '<p class="card-title" style="margin-bottom:2px;">' + escapeHtml(currentForm.Name) + '</p>' +
        '<p class="card-subtitle" data-i18n="apply.editSubtitle" style="margin-bottom:14px;"></p>' +
        rejectedHtml +
        '<div class="apply-error-banner" id="submit-error"></div>' +
        '<div id="form-fields"></div>' +
        '<div class="apply-kvkk-box">' +
          '<div class="apply-kvkk-text" data-i18n="apply.kvkkText"></div>' +
          '<label class="apply-checkbox-row">' +
            '<input type="checkbox" id="kvkk-consent">' +
            '<span data-i18n="apply.kvkkAccept"></span>' +
          '</label>' +
        '</div>' +
        '<button class="btn btn-primary" id="submit-btn" style="width:100%; justify-content:center;" data-i18n="apply.saveChanges"></button>' +
        '<div id="submit-progress" style="display:none;"></div>' +
      '</div>';

    STSI18N.applyToDom();

    const fieldsContainer = document.getElementById('form-fields');
    formCtl = STSApplyForm.render(fieldsContainer, currentForm, { mode: 'edit', rejectedFields: rejectedFields });

    document.getElementById('submit-btn').addEventListener('click', submitEdit);
  }

  async function submitEdit() {
    const errorBox = document.getElementById('submit-error');
    errorBox.classList.remove('show');

    const kvkkConsent = document.getElementById('kvkk-consent').checked;
    if (!kvkkConsent) {
      errorBox.textContent = STSI18N.t('apply.kvkkRequired');
      errorBox.classList.add('show');
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      return;
    }

    const { formData, files } = formCtl.collect();
    const payload = {
      action: 'application.edit',
      editToken: editToken,
      formData: formData,
      files: files
    };

    const submitBtn = document.getElementById('submit-btn');
    const progressContainer = document.getElementById('submit-progress');
    submitBtn.style.display = 'none';
    progressContainer.style.display = 'block';
    const ring = STSApplyForm.createProgressRing(progressContainer, STSI18N.t('apply.uploading'));

    STSApplyForm.submitWithProgress(
      BASE_URL,
      payload,
      function (percent) { ring.setPercent(percent); },
      function (result) {
        if (result.ok) {
          showSuccess(result);
        } else {
          progressContainer.style.display = 'none';
          submitBtn.style.display = '';
          submitBtn.disabled = false;
          submitBtn.textContent = STSI18N.t('apply.saveChanges');
          errorBox.textContent = result.error || STSI18N.t('apply.error.generic');
          errorBox.classList.add('show');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      },
      function (errMsg) {
        progressContainer.style.display = 'none';
        submitBtn.style.display = '';
        submitBtn.disabled = false;
        submitBtn.textContent = STSI18N.t('apply.saveChanges');
        errorBox.textContent = errMsg;
        errorBox.classList.add('show');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    );
  }

  function showSuccess(result) {
    lastState = 'success';
    document.getElementById('apply-content').innerHTML =
      '<div class="card apply-success-screen">' +
        '<div class="apply-success-icon">✓</div>' +
        '<p style="font-size:16px; font-weight:700; margin-bottom:8px;" data-i18n="apply.editSuccessTitle"></p>' +
        '<p style="font-size:13px; color:var(--text-secondary);" data-i18n="apply.editSuccessDesc"></p>' +
      '</div>';
    STSI18N.applyToDom();
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  init();
</script>

</body>
</html>
